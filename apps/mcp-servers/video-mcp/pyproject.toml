[project]
name = "maxp-mcp-video"
version = "0.1.0"
description = "MaxP Video Generation MCP Server - Google Veo automation and status tracking"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [
    { name = "MaxP Engineering" },
]
dependencies = [
    "mcp[cli]>=1.2,<2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "structlog>=24.4",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxp_mcp_video"]

[project.scripts]
maxp-mcp-video = "maxp_mcp_video:serve"
