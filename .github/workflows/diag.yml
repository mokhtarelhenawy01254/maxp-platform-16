name: Remote Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run Diagnostics on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            echo "=== PM2 Status ==="
            pm2 list
            
            echo "=== Recent Failed Provider Logs ==="
            cd /var/www/backend2
            node -e "
              const path = require('path');
              const { PrismaClient } = require('./prisma/generated/postgresql_v2');
              const prisma = new PrismaClient();
              async function run() {
                const logs = await prisma.\$queryRaw\`
                  SELECT id, status, reply_preview, reason, violations, created_at 
                  FROM ai.self_review_log 
                  ORDER BY created_at DESC 
                  LIMIT 15
                \`;
                console.log(JSON.stringify(logs, null, 2));
              }
              run().catch(console.error).finally(() => prisma.\$disconnect());
            "

