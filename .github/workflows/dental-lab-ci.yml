name: dental-lab-ci

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'apps/backend/controller/dentalLab*.js'
      - 'apps/backend/routes/dentalLab*.js'
      - 'apps/backend/services/dental*.js'
      - 'apps/backend/tests/controller/dentalLab*.test.js'
      - 'apps/frontend/src/pages/dental-lab/**'
      - 'apps/frontend/src/pages/dental-doctor/**'
  push:
    branches: [main]
    paths:
      - 'apps/backend/controller/dentalLab*.js'
      - 'apps/backend/routes/dentalLab*.js'
      - 'apps/backend/services/dental*.js'
      - 'apps/backend/tests/controller/dentalLab*.test.js'
      - 'apps/frontend/src/pages/dental-lab/**'
      - 'apps/frontend/src/pages/dental-doctor/**'

concurrency:
  group: dental-lab-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax + dental tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Syntax check dental files
        run: |
          for f in controller/dentalLabController.js controller/dentalLabPortalController.js routes/dentalLabRoutes.js routes/dentalLabPortalRoutes.js services/dentalPricing.js services/dentalBillingPolicy.js services/dentalRoles.js services/dentalWorkOrderService.js services/dentalLabNotificationService.js; do
            node --check "$f" || exit 1
          done
      - name: Dental test suites
        run: node node_modules/jest/bin/jest.js tests/controller/dentalLab --runInBand --testTimeout=30000 --forceExit

  # On push to main the frontend build is redundant: deploy.yml always
  # rebuilds the frontend for every push. Only build it here on PRs,
  # where it is the sole frontend gate.
  frontend:
    name: Frontend build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run i18n:merge
      - run: npm run i18n:types
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"