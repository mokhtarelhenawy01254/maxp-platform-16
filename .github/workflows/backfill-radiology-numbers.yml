name: Run radiology numbering backfill on server

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no DB changes)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  run-script:
    name: Backfill bookingNo + accessionNumber on server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Upload script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: apps/backend/scripts/one-off/backfill-radiology-numbers.js
          target: /var/www/backend2/scripts/one-off/
          strip_components: 4
          overwrite: true

      - name: Execute backfill script on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          envs: DRY_RUN
          script: |
            set -euo pipefail
            cd /var/www/backend2
            ls -la scripts/one-off/backfill-radiology-numbers.js
            echo "Running with DRY_RUN=$DRY_RUN"
            node scripts/one-off/backfill-radiology-numbers.js
