    <text x="820" y="276" text-anchor="middle" font-size="23" font-weight="700" fill="#17304a">Scratch</text>
    <text x="820" y="303" text-anchor="middle" font-size="14" fill="#586b78">قصة أو لعبة تفاعلية</text>

