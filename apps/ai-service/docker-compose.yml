# Local development only — production uses external managed Postgres.
services:
  maxp-ai-service:
    build:
      context: .
    container_name: maxp-ai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://maxp:maxp@postgres:5432/maxp_ai
      MAXP_API_URL: http://host.docker.internal:3000
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    container_name: maxp-ai-postgres
    environment:
      POSTGRES_USER: maxp
      POSTGRES_PASSWORD: maxp
      POSTGRES_DB: maxp_ai
    ports:
      - "5433:5432"
    volumes:
      - maxp-ai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxp -d maxp_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  maxp-ai-pgdata:
