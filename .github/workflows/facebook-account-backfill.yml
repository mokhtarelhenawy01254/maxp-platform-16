name: Backfill Facebook Account Connections

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
    steps:
      - name: Run backfill on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          timeout: 60s
          command_timeout: 50m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd /var/www/backend2
            NODE_ENV=production node scripts/backfill_facebook_account_connections.js
