name: Run lead fields backfill (wave 0 CRM)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no DB changes)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  run-script:
    name: Backfill Customer lead columns on server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Upload script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: scripts/backfill-lead-fields.cjs
          target: /var/www/backend2/scripts/one-off/
          strip_components: 1
          overwrite: true

      - name: Execute backfill on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          envs: DRY_RUN
          script: |
            set -euo pipefail
            cd /var/www/backend2
            echo "Current backend dir: $(pwd)"
            echo "── Verify wave-0 columns exist on prod DB ──"
            node -e "const {PrismaClient}=require('./prisma/generated/postgresql_v2');const p=new PrismaClient();p.\$queryRawUnsafe(\"SELECT column_name FROM information_schema.columns WHERE table_name='customers' AND column_name IN ('leadStage','leadPriority','leadSource','assignedToId','nextFollowUpDate','followUpReminderSentAt','firstContactAt')\").then(r=>{const names=r.map(c=>c.column_name);console.log('COLUMNS FOUND:',names.join(','));if(names.length<7){console.error('MISSING COLUMNS — deploy db push incomplete');process.exit(2);}return p.\$disconnect();}).catch(e=>{console.error('DB CHECK FAILED:',e.message);process.exit(1);})"
            echo "── Verify lead crons started on server ──"
            pm2 list 2>/dev/null | head -6 || echo "(pm2 list unavailable)"
            echo "--- pm2 log dir ---"
            ls ~/.pm2/logs/ 2>/dev/null | head -6 || echo "(no ~/.pm2/logs)"
            echo "--- app logs dir ---"
            ls /var/www/backend2/logs/ 2>/dev/null | head -10 || echo "(no app logs dir)"
            echo "--- grep cron banners across likely log locations ---"
            grep -rah "LEAD-REMINDER-CRON" ~/.pm2/logs/ /var/www/backend2/logs/ 2>/dev/null | tail -4 || true
            grep -rah "CART-RECOVERY-CRON" ~/.pm2/logs/ /var/www/backend2/logs/ 2>/dev/null | tail -4 || true
            echo "--- cron tick since restart ---"
            grep -rah "Checking for due lead follow-ups\|Sweeping abandoned guest carts" ~/.pm2/logs/ /var/www/backend2/logs/ 2>/dev/null | tail -4 || true
            echo "── Running lead fields backfill with DRY_RUN=$DRY_RUN ──"
            node scripts/one-off/backfill-lead-fields.cjs --batch=500
