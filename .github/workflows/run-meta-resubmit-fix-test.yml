name: Run Meta Resubmit Fix Test

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Swan Admin Password (or set in secrets.SWAN_ADMIN_PASSWORD)'
        required: false
        type: string

jobs:
  run-test:
    name: Test resubmit-meta fix on production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Upload scripts to server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/maxp_deploy_key" -P "$SERVER_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            apps/backend/scripts/test-meta-resubmit-fix.js \
            "$SERVER_USER@$SERVER_HOST:/tmp/test-meta-resubmit-fix.js"
          scp -i "$HOME/.ssh/maxp_deploy_key" -P "$SERVER_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            apps/backend/scripts/diag-meta-update.js \
            "$SERVER_USER@$SERVER_HOST:/tmp/diag-meta-update.js"
          echo "✅ Scripts uploaded to /tmp"

      - name: Execute test on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          PASSWORD: ${{ github.event.inputs.password || secrets.SWAN_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          envs: PASSWORD
          script: |
            set -euo pipefail
            echo "📍 Running test-meta-resubmit-fix.js (calls real resubmit-meta endpoint)..."
            node /tmp/test-meta-resubmit-fix.js
            echo "✅ Finished!"
