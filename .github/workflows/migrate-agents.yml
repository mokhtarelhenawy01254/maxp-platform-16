name: SSH Command Runner
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run via SSH on the server'
        required: true
        type: choice
        options:
          - 'echo "OK"'
          - 'pm2 list'
          - 'pm2 status'
          - 'pm2 logs maxp-ai-service --lines 30 --nostream'
          - 'pm2 logs maxp-backend --lines 30 --nostream'
          - 'node scripts/migrate_agents_tool_registry.js'
          - 'node scripts/migrate_agents_to_new_memory.js'
          - 'ls -la /var/www/backend2/scripts/'
          - 'ls -la /var/www/ai-service/'
          - 'df -h'
          - 'free -m'
          - 'tail -50 /var/www/backend2/logs/err.log'
          - 'tail -50 /var/www/backend2/logs/out.log'

jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MAXP3_CHECKOUT_TOKEN || github.token }}

      - name: Prepare SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Execute Command
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
          CMD: ${{ inputs.command }}
        run: |
          set -euo pipefail
          SSH_KEY_PATH="$HOME/.ssh/maxp_deploy_key"
          SSH_OPTS=(
            -i "$SSH_KEY_PATH"
            -p "$SERVER_SSH_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
            -o ConnectTimeout=300
          )

          echo "🚀 Running command on server..."
          timeout 15m ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "export NVM_DIR=\"\$HOME/.nvm\" && [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\" && export PATH=\"\$(dirname \"\$(command -v node)\"):/root/.local/bin:\$PATH\" && $CMD"
          echo "✅ Command completed"
