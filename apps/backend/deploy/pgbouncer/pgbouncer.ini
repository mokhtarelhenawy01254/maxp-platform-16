[databases]
# PgBouncer maps the virtual "maxp" DB to the real Postgres.
# The backend connects to: postgresql://appuser:pass@127.0.0.1:6432/maxp
maxp = host=127.0.0.1 port=5432 dbname=maxp

[pgbouncer]
# Listen only on loopback — backend, worker and scripts are all local.
listen_addr = 127.0.0.1
listen_port = 6432

# Transaction pooling is REQUIRED for Prisma multi-tenant RLS:
# each interactive $transaction gets a clean server connection, and the
# is_local set_config never leaks across tenants.
pool_mode = transaction

# Auth: userlist is generated at install time from POSTGRES_URL in .env
# (never commit real credentials). MUST be scram-sha-256 — Postgres ≥14 stores
# roles as SCRAM verifiers, so md5 auth can never validate (2026-08-31 crash
# loop). Plaintext in userlist.txt is required for SCRAM; the file is 640
# root:pgbouncer and lives only on the server.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
# install-pgbouncer.sh rewrites these to the real POSTGRES_URL role.
admin_users = appuser
stats_users = appuser

# Per-pool server connections. This is the REAL cap on Postgres server
# connections from the whole app (backend + worker + scripts), replacing the
# old per-process 25/process × processes model. Measured before install:
# 162 pooled conns, of which 61 were idle-in-transaction (pinned) — transaction
# pooling frees them between transactions, so 30 real conns serve the same
# load with huge headroom. Tune after install via pg_stat_activity.
default_pool_size = 30
max_client_conn = 500

# Connection settings
server_idle_timeout = 120
server_lifetime = 3600
client_idle_timeout = 0
query_wait_timeout = 30
server_connect_timeout = 30

# Prepared statements: keep them enabled server-side (PgBouncer 1.21+).
# Prisma is told via ?pgbouncer=true (unless PG_BOUNCER_PREPARED=1) so it
# doesn't rely on named prepared statements across pool connections.
max_prepared_statements = 100

# Misc
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
application_name_add_host = 1