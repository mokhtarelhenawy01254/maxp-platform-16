name: Remote Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run WhatsApp Test on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            echo "=== PM2 Status ==="
            pm2 list
            
            echo "=== Checking WhatsApp Sessions ==="
            cd /var/www/backend2
            node -e "
              const { getSharedPrismaClient } = require('./services/sharedDatabase');
              const prisma = getSharedPrismaClient();
              async function run() {
                const sessions = await prisma.whatsAppSession.findMany({
                  select: { id: true, name: true, status: true, phoneNumber: true, companyId: true, provider: true, sessionProvider: true },
                  orderBy: { createdAt: 'desc' }
                });
                console.log('Sessions:', JSON.stringify(sessions, null, 2));
                const settings = await prisma.whatsAppNotificationSettings.findFirst({
                  select: { companyId: true, defaultSessionId: true, isEnabled: true }
                });
                console.log('Settings:', JSON.stringify(settings, null, 2));
              }
              run().catch(console.error).finally(() => prisma.\$disconnect());
            "
            
            echo "=== Running WhatsApp Test Script ==="
            node scripts/test-direct.js

