version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React
  - Vite
  - Tailwind CSS
  - Material UI (MUI)
  - Framer Motion
  - TanStack Query
  - i18next
routes:
  - path: /
    file: frontend/src/pages/storefront/StorefrontRuntime.tsx
    auth_required: false
    description: Dynamic storefront homepage
  - path: /shop
    file: frontend/src/pages/storefront/StorefrontRuntime.tsx
    auth_required: false
    description: Dynamic collection/shop page
  - path: /product/:id
    file: frontend/src/pages/storefront/StorefrontRuntime.tsx
    auth_required: false
    description: Dynamic product detail page
  - path: /cart
    file: frontend/src/pages/storefront/StorefrontRuntime.tsx
    auth_required: false
    description: Shopping cart page
  - path: /checkout
    file: frontend/src/pages/storefront/StorefrontRuntime.tsx
    auth_required: false
    description: Secure checkout flow
  - path: /subscription
    file: frontend/src/pages/MySubscription.tsx
    auth_required: true
    description: Billing and subscription management
  - path: /settings
    file: frontend/src/pages/Settings.tsx
    auth_required: true
    description: Profile and store settings
features:
  - name: Storefront Template Rendering
    description: Manifest-driven storefront rendering using atomic sections.
    files:
      - frontend/src/storefront/runtime/UniversalSectionRenderer.tsx
      - frontend/src/pages/storefront/StorefrontRuntime.tsx
    entry_route: /
    user_interactions:
      - Navigate to homepage with different layouts (e.g., ?layout=aura-chic)
      - View dynamic sections (Hero, Featured Collection, etc.)
  - name: Customer Purchase Journey
    description: Full flow from product discovery to checkout.
    files:
      - frontend/src/hooks/useCart.ts
      - frontend/src/hooks/useCheckout.ts
    entry_route: /shop
    user_interactions:
      - Add product to cart from Shop or PDP
      - View cart content
      - Proceed to checkout
      - Apply coupon code
      - Complete order
known_limitations: []
