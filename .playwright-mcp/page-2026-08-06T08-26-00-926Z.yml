              - generic [ref=f37e111]:
                - button "Marketing" [ref=f37e112] [cursor=pointer]
                - paragraph [ref=f37e117]: Marketing messages can help businesses achieve a wide range of goals across the funnel, from generating awareness to driving sales to retargeting customers. These messages can include offers and promos, related product suggestions, abandoned cart reminders, and more.
                - link [ref=f37e119] [cursor=pointer]:
                  - /url: /products/conversation-categories/marketing
                  - text: Learn more
              - generic [ref=f37e120]:
                - button "Utility" [ref=f37e121] [cursor=pointer]
                - paragraph [ref=f37e126]: Utility messages are typically triggered by a user action, like placing an order or submitting a payment. These messages are not promotional, and are either specific to or requested by a user (like a package delivery update) or critical to a user (like a tornado warning).
                - link [ref=f37e128] [cursor=pointer]:
                  - /url: /products/conversation-categories/utility
                  - text: Learn more
              - generic [ref=f37e129]:
                - button "Authentication" [ref=f37e130] [cursor=pointer]
                - paragraph [ref=f37e135]: Authentication messages enable businesses to use one-time passwords (OTPs) for identity verification, potentially at multiple stages of the user journey. Ensure successful login or transactions with OTPs on WhatsApp.
                - link [ref=f37e137] [cursor=pointer]:
                  - /url: /products/conversation-categories/authentication
                  - text: Learn more
              - generic [ref=f37e138]:
                - button "Service" [ref=f37e139] [cursor=pointer]
                - paragraph [ref=f37e144]: These messages enable businesses to manage incoming customer inquiries, whether that is via an agent or a conversational AI-powered bot. When users message a business, this opens a 24-hour customer service window during which businesses can respond with service messages, at no charge. This window resets with each user message.
                - link [ref=f37e146] [cursor=pointer]:
