name: Deploy to Server

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch: # للسماح بالتشغيل اليدوي

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Frontend & Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MAXP3_CHECKOUT_TOKEN || github.token }}
          fetch-depth: 2 # Required for git diff HEAD~1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "❌ SERVER_HOST missing"; exit 1; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "❌ SERVER_USER missing"; exit 1; fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then echo "❌ SERVER_SSH_KEY missing"; exit 1; fi
          echo "✅ All secrets present"

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Test SSH Connection
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" \
            "echo '✅ SSH connection successful' && df -h \$HOME"

      - name: Get Runner IP
        run: |
          RUNNER_IP=$(curl -s https://ifconfig.me)
          echo "🌐 GitHub Runner Public IP: $RUNNER_IP"
          echo "🎯 Target SSH Port: ${{ env.SERVER_SSH_PORT }}"

      - name: Enforce AI Agent File Size Guard
        run: |
          node scripts/check-file-sizes.js --max-kb=150

      - name: Cache Backend node_modules
        uses: actions/cache@v4
        id: cache-backend
        with:
          path: apps/backend/node_modules
          key: backend-node-${{ hashFiles('apps/backend/package-lock.json') }}
          restore-keys: |
            backend-node-

      - name: Cache Frontend node_modules
        uses: actions/cache@v4
        id: cache-frontend
        with:
          path: apps/frontend/node_modules
          key: frontend-node-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            frontend-node-

      - name: Install Backend Test Dependencies
        if: steps.cache-backend.outputs.cache-hit != 'true'
        working-directory: ./apps/backend
        run: |
          npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: '1'
          HUSKY: '0'
        continue-on-error: false

      - name: Generate Prisma Client
        if: steps.cache-backend.outputs.cache-hit != 'true'
        working-directory: ./apps/backend
        run: |
          npx prisma generate --schema=prisma/schema
        continue-on-error: false

      - name: Run Facebook Ads Regression Tests
        working-directory: ./apps/backend
        run: |
          npx jest tests/controller/facebookAdsController.fullAd.test.js --runInBand --testTimeout=30000 --forceExit
        continue-on-error: false

      # Build Frontend
      - name: Install Frontend Dependencies
        working-directory: ./apps/frontend
        run: |
          if [ "${{ steps.cache-frontend.outputs.cache-hit }}" != 'true' ] || [ ! -f node_modules/.bin/vite ]; then
            echo "📦 Installing frontend dependencies (cache-hit=${{ steps.cache-frontend.outputs.cache-hit }}, vite-found=$(test -f node_modules/.bin/vite && echo yes || echo no))..."
            npm ci
          else
            echo "✅ Frontend dependencies restored from cache and vite binary found"
          fi
        env:
          HUSKY: '0'
        continue-on-error: false

      - name: Build Frontend
        working-directory: ./apps/frontend
        run: |
          npm run build
          test -f dist/placeholders/luxury-shoes/hero.png
          echo "📂 Listing build files:"
          ls -R dist | head -n 20
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          VITE_DISABLE_COMPRESSION: 'true'
          VITE_BUILD_MINIFY: 'esbuild'
        continue-on-error: false

      - name: Validate i18n Sections
        run: node scripts/validate-i18n.js
        continue-on-error: false

      # Strip dev dependencies after tests (deps already installed above)
      - name: Prune Dev Dependencies
        working-directory: ./apps/backend
        run: |
          npm prune --production --ignore-scripts
        env:
          HUSKY: '0'
        continue-on-error: false

      # Packaging for reliable transfer (Optimized to exclude large node_modules)
      - name: Package Assets
        run: |
          echo "📦 Packaging Frontend..."
          tar -czf frontend.tar.gz -C apps/frontend/dist .
          tar -czf theme-presets.tar.gz -C apps/frontend/src/storefront/themes .
          tar -czf backend.tar.gz -C apps --exclude="backend/node_modules" --exclude="backend/prisma/generated" --exclude="backend/legacy_mysql" --exclude="backend/uploads" --exclude="backend/*.tar.gz" backend
          
          echo "📦 Packaging Shared..."
          tar -czf shared.tar.gz -C shared .

          echo "📦 Packaging AI service..."
          tar -czf ai-service.tar.gz \
            --exclude=".env" \
            --exclude=".venv" \
            --exclude="__pycache__" \
            --exclude=".pytest_cache" \
            --exclude=".ruff_cache" \
            --exclude="*.pyc" \
            -C apps ai-service

          echo "📦 Packaging Nginx configs..."
          rm -rf deploy_nginx
          mkdir -p deploy_nginx
          cp nginx_configs/maxp.online.conf deploy_nginx/maxp.online.conf
          cp nginx_configs/mokhtarelhenawy.online.conf deploy_nginx/mokhtarelhenawy.online.conf
          tar -czf nginx-configs.tar.gz -C deploy_nginx .
          rm -rf deploy_nginx

          ls -lh *.tar.gz

      - name: Upload Build Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deploy-tarballs-${{ github.run_id }}
          path: |
            frontend.tar.gz
            backend.tar.gz
            ai-service.tar.gz
            shared.tar.gz
            nginx-configs.tar.gz
            theme-presets.tar.gz
          retention-days: 3

      # Setup Remote Staging Directory

      - name: Setup Remote Staging Directory
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_KEY_PATH="$HOME/.ssh/maxp_deploy_key"
          ssh -i "$SSH_KEY_PATH" -p "$SERVER_SSH_PORT" -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" "
            set -e
            DEPLOY_STAGING=\"\$HOME/deploy_staging_${{ github.run_id }}_${{ github.run_attempt }}\"
            echo '🚀 Creating staging directory...'
            rm -rf \"\$DEPLOY_STAGING\"
            mkdir -p \"\$DEPLOY_STAGING/backend\"
            mkdir -p \"\$DEPLOY_STAGING/frontend\"
            echo \"✅ Staging directory created: \$DEPLOY_STAGING\"
            df -h \$HOME
          "

      # Deploy Tarballs to Server
      - name: Deploy Tarballs to Server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_KEY_PATH="$HOME/.ssh/maxp_deploy_key"
          ssh-keyscan -p "$SERVER_SSH_PORT" -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          for i in 1 2 3; do
            echo "🔄 SCP attempt $i/3..."
            if timeout 30m scp \
              -i "$SSH_KEY_PATH" \
              -P "$SERVER_SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o ConnectTimeout=30 \
              *.tar.gz \
              "$SERVER_USER@$SERVER_HOST:deploy_staging_${{ github.run_id }}_${{ github.run_attempt }}/"; then
              echo "✅ Tarballs transferred successfully"
              break
            else
              echo "⚠️ SCP attempt $i failed"
              if [ $i -eq 3 ]; then
                echo "❌ All SCP attempts failed"
                exit 1
              fi
              sleep 5
            fi
          done

          echo "📋 Copying deployment script..."
          scp -i "$SSH_KEY_PATH" -P "$SERVER_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            scripts/deploy-remote.sh \
            "$SERVER_USER@$SERVER_HOST:deploy_staging_${{ github.run_id }}_${{ github.run_attempt }}/deploy-remote.sh"

      - name: Run Deployment Script on Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          timeout: 300s
          command_timeout: 50m
          envs: GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,SUPER_ADMIN_EMAIL,SUPER_ADMIN_PASSWORD
          script: |
            set -e
            sudo -n true || {
              echo "❌ Passwordless sudo is required for production deploys"
              exit 1
            }
            export DEPLOY_STAGING="$HOME/deploy_staging_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
            exec 9>/tmp/maxp-production-deploy.lock
            if ! flock -n 9; then
              echo "❌ Another production deployment is already running on the server"
              exit 1
            fi
            bash "$DEPLOY_STAGING/deploy-remote.sh"