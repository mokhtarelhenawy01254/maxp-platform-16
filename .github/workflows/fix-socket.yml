name: Fix Socket.IO (PM2 restart + logs)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do on the server"
        required: true
        default: "restart"
        type: choice
        options:
          - restart
          - logs
          - status

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (needed for local action)
        uses: actions/checkout@v5

      - name: Setup SSH key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run on server
        env:
          ACTION: ${{ github.event.inputs.action }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if ssh -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
               -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
               "$SERVER_USER@$SERVER_HOST" "echo SSH_OK"; then
              break
            fi
            echo "SSH attempt $i/5 failed, retrying in 20s..."
            sleep 20
          done

          case "$ACTION" in
            restart)
              echo "=== PM2 STATUS (before) ==="
              ssh -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
                "$SERVER_USER@$SERVER_HOST" "pm2 status; echo '--- restarting ---'; pm2 restart maxp-backend; echo '--- status after ---'; pm2 status"
              ;;
            logs)
              echo "=== PM2 LOGS (maxp-backend, last 120 lines) ==="
              ssh -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
                "$SERVER_USER@$SERVER_HOST" "pm2 logs maxp-backend --lines 120 --nostream"
              ;;
            status)
              ssh -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
                "$SERVER_USER@$SERVER_HOST" "pm2 status; echo '--- port 3007 ---'; (ss -tlnp 2>/dev/null | grep 3007 || netstat -tlnp 2>/dev/null | grep 3007 || echo 'port 3007 NOT listening'); echo '--- redis ---'; (redis-cli ping 2>/dev/null || echo 'redis-cli missing')"
              ;;
          esac
