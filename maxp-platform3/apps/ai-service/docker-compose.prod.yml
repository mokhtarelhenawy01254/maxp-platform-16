# Production deployment — uses .env for all secrets and config.
services:
  maxp-ai-service:
    build:
      context: .
    container_name: maxp-ai-service
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ../backend/agents:/app/agents:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: maxp-ai-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maxp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxp}
      POSTGRES_DB: ${POSTGRES_DB:-maxp_ai}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - maxp-ai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxp} -d ${POSTGRES_DB:-maxp_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  maxp-ai-pgdata:
