name: Run Swan Yasmine Test Scenario

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Swan Admin Password'
        required: true
        default: '0165676135'
        type: string

jobs:
  run-test:
    name: Execute Yasmine simulation scenario on production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Execute test script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/backend2
            echo "📍 Current dir: $(pwd)"
            echo "🚀 Running test-swan-yasmine.js..."
            export PASSWORD="${{ github.event.inputs.password }}"
            node scripts/test-swan-yasmine.js
            echo "✅ Finished!"
