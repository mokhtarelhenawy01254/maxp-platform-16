<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Product Landing Pages Concept</title>
  <desc id="desc">Conceptual diagram for independent product landing pages connected to products, ads, checkout, and analytics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="48%" stop-color="#edf6f5"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-slate" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#d97706"/>
    </marker>
    <style>
      .rtl { direction: rtl; unicode-bidi: plaintext; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
      .ltr { direction: ltr; unicode-bidi: plaintext; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
      .title { font-size: 48px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #475569; }
      .card-title { font-size: 25px; font-weight: 800; fill: #0f172a; }
      .card-title-light { font-size: 25px; font-weight: 800; fill: #ffffff; }
      .body { font-size: 19px; font-weight: 500; fill: #334155; }
      .body-light { font-size: 19px; font-weight: 500; fill: #e0f2f1; }
      .small { font-size: 16px; font-weight: 600; fill: #475569; }
      .small-light { font-size: 16px; font-weight: 600; fill: #ccfbf1; }
      .chip { font-size: 15px; font-weight: 800; fill: #0f172a; }
      .route { font-size: 18px; font-weight: 800; fill: #0f766e; }
      .muted { fill: #64748b; }
      .card { fill: #ffffff; stroke: #dbeafe; stroke-width: 1.5; filter: url(#shadow); }
      .thin-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .arrow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <path d="M0 160 C260 95 410 250 650 185 C880 122 1040 46 1280 122 C1440 172 1535 145 1600 104 L1600 0 L0 0 Z" fill="#e0f2fe" opacity="0.45"/>
  <path d="M0 870 C180 800 330 940 540 870 C760 796 900 742 1120 820 C1335 896 1460 850 1600 770 L1600 1000 L0 1000 Z" fill="#ffedd5" opacity="0.55"/>

  <text x="800" y="76" text-anchor="middle" class="rtl title">تصور ميزة صفحات هبوط مستقلة للمنتجات</text>
  <text x="800" y="116" text-anchor="middle" class="rtl subtitle">صفحة إعلانية منفصلة لكل منتج، لكنها متصلة بالمخزون والطلب والتتبع والتحليلات</text>

  <!-- Admin setup -->
  <rect x="80" y="190" rx="18" ry="18" width="330" height="255" class="card"/>
  <circle cx="354" cy="236" r="34" fill="#dbeafe"/>
  <path d="M338 238 h32 M344 226 h20 M344 250 h20" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="360" y="228" text-anchor="start" class="rtl card-title">لوحة التحكم</text>
  <text x="360" y="266" text-anchor="start" class="rtl body">اختيار المنتج</text>
  <text x="360" y="298" text-anchor="start" class="rtl body">اختيار قالب الصفحة</text>
  <text x="360" y="330" text-anchor="start" class="rtl body">كتابة العرض والـ CTA</text>
  <text x="360" y="362" text-anchor="start" class="rtl body">إعداد SEO و UTM</text>
  <rect x="116" y="389" rx="10" ry="10" width="250" height="34" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="241" y="412" text-anchor="middle" class="rtl small">تجهيز سريع من بيانات المنتج</text>

  <!-- Product data -->
  <rect x="80" y="540" rx="18" ry="18" width="330" height="225" class="thin-card"/>
  <circle cx="354" cy="585" r="34" fill="#dcfce7"/>
  <path d="M340 588 h28 M340 598 h22 M348 574 h18" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <text x="360" y="580" text-anchor="start" class="rtl card-title">مصادر البيانات</text>
  <text x="360" y="620" text-anchor="start" class="rtl body">صور المنتج وفيديوهاته</text>
  <text x="360" y="652" text-anchor="start" class="rtl body">السعر والمخزون والمتغيرات</text>
  <text x="360" y="684" text-anchor="start" class="rtl body">التقييمات والأسئلة الشائعة</text>
  <text x="360" y="716" text-anchor="start" class="rtl body">سياسات الشحن والاستبدال</text>

  <!-- Core model -->
  <rect x="505" y="300" rx="24" ry="24" width="590" height="310" fill="url(#core)" filter="url(#shadow)"/>
  <text x="1050" y="352" text-anchor="start" class="rtl card-title-light">الميزة الجديدة المقترحة</text>
  <text x="1050" y="390" text-anchor="end" class="ltr body-light">ProductLandingPage</text>
  <rect x="548" y="420" rx="13" ry="13" width="505" height="52" fill="#ffffff" opacity="0.13"/>
  <text x="1028" y="454" text-anchor="start" class="rtl body-light">slug مستقل: صفحة واحدة أو أكثر لنفس المنتج</text>
  <rect x="548" y="490" rx="13" ry="13" width="238" height="74" fill="#ffffff" opacity="0.15"/>
  <text x="760" y="520" text-anchor="start" class="rtl small-light">Draft / Published</text>
  <text x="760" y="548" text-anchor="start" class="rtl small-light">نسخة مسودة ونسخة منشورة</text>
  <rect x="815" y="490" rx="13" ry="13" width="238" height="74" fill="#ffffff" opacity="0.15"/>
  <text x="1028" y="520" text-anchor="start" class="rtl small-light">SEO / Pixel / CAPI</text>
  <text x="1028" y="548" text-anchor="start" class="rtl small-light">تتبع كامل للحملات</text>
  <text x="1050" y="592" text-anchor="end" class="route ltr">/lp/swan-high-skotch</text>

  <!-- Templates -->
  <rect x="1190" y="185" rx="18" ry="18" width="330" height="92" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="1490" y="225" text-anchor="start" class="rtl card-title">قالب عرض مباشر</text>
  <text x="1490" y="254" text-anchor="start" class="rtl small">سعر، خصم، فورم طلب سريع</text>

  <rect x="1190" y="312" rx="18" ry="18" width="330" height="92" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="1490" y="352" text-anchor="start" class="rtl card-title">قالب UGC وثقة</text>
  <text x="1490" y="381" text-anchor="start" class="rtl small">مراجعات، صور عملاء، أسئلة</text>

  <rect x="1190" y="439" rx="18" ry="18" width="330" height="92" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
  <text x="1490" y="479" text-anchor="start" class="rtl card-title">قالب باقة أو مقارنة</text>
  <text x="1490" y="508" text-anchor="start" class="rtl small">Bundle، قبل/بعد، بدائل</text>

  <!-- Public page -->
  <rect x="520" y="690" rx="24" ry="24" width="560" height="195" class="card"/>
  <text x="1035" y="742" text-anchor="start" class="rtl card-title">الصفحة المنشورة للعميل</text>
  <text x="1035" y="782" text-anchor="start" class="rtl body">Hero يوضح المنتج والعرض من أول شاشة</text>
  <text x="1035" y="815" text-anchor="start" class="rtl body">CTA واضح: اطلب الآن / أضف للسلة</text>
  <text x="1035" y="848" text-anchor="start" class="rtl body">فورم سريع + شارات ثقة + مراجعات</text>
  <rect x="560" y="734" rx="14" ry="14" width="150" height="112" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="635" cy="770" r="24" fill="#fde68a"/>
  <rect x="588" y="808" width="94" height="14" rx="7" fill="#94a3b8"/>
  <rect x="603" y="832" width="64" height="10" rx="5" fill="#cbd5e1"/>

  <!-- Traffic -->
  <rect x="1170" y="650" rx="18" ry="18" width="350" height="205" class="thin-card"/>
  <text x="1485" y="700" text-anchor="start" class="rtl card-title">مصادر الزيارات</text>
  <text x="1485" y="740" text-anchor="start" class="rtl body">Facebook / Instagram Ads</text>
  <text x="1485" y="772" text-anchor="start" class="rtl body">روابط المسوقين</text>
  <text x="1485" y="804" text-anchor="start" class="rtl body">رسائل واتساب وماسنجر</text>
  <text x="1485" y="836" text-anchor="start" class="rtl body">بحث أو رابط مباشر</text>

  <!-- Orders analytics -->
  <rect x="80" y="825" rx="18" ry="18" width="330" height="105" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <text x="360" y="866" text-anchor="start" class="rtl card-title">النتيجة</text>
  <text x="360" y="900" text-anchor="start" class="rtl body">طلب مؤكد + Attribution + ROAS</text>

  <rect x="515" y="920" rx="17" ry="17" width="570" height="48" fill="#0f172a" opacity="0.92"/>
  <text x="800" y="952" text-anchor="middle" class="rtl small-light">الفكرة الأساسية: صفحة مستقلة للتسويق، مرتبطة بنفس المنتج والمخزون ونظام الطلبات</text>

  <!-- Arrows -->
  <path class="arrow" d="M410 314 C458 316 464 362 505 395" stroke="#0f766e" marker-end="url(#arrow-teal)"/>
  <path class="arrow" d="M410 635 C475 610 477 552 505 523" stroke="#0f766e" marker-end="url(#arrow-teal)"/>
  <path class="arrow" d="M1095 392 C1134 342 1146 253 1190 232" stroke="#334155" marker-end="url(#arrow-slate)"/>
  <path class="arrow" d="M1095 447 C1140 430 1148 374 1190 361" stroke="#334155" marker-end="url(#arrow-slate)"/>
  <path class="arrow" d="M1095 507 C1141 512 1149 488 1190 486" stroke="#334155" marker-end="url(#arrow-slate)"/>
  <path class="arrow" d="M1265 650 C1200 620 1148 697 1080 748" stroke="#d97706" marker-end="url(#arrow-amber)"/>
  <path class="arrow" d="M800 610 L800 690" stroke="#0f766e" marker-end="url(#arrow-teal)"/>
  <path class="arrow" d="M520 808 C455 830 458 878 410 878" stroke="#d97706" marker-end="url(#arrow-amber)"/>

  <!-- Chips -->
  <rect x="523" y="173" rx="18" ry="18" width="190" height="38" fill="#dcfce7" stroke="#86efac"/>
  <text x="618" y="198" text-anchor="middle" class="rtl chip">A/B Testing</text>
  <rect x="735" y="173" rx="18" ry="18" width="190" height="38" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="830" y="198" text-anchor="middle" class="rtl chip">UTM Links</text>
  <rect x="947" y="173" rx="18" ry="18" width="190" height="38" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="1042" y="198" text-anchor="middle" class="rtl chip">Meta Pixel</text>
</svg>

