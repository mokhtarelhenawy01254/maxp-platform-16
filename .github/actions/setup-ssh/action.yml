name: 'Setup SSH Key'
description: 'Setup SSH key for MaxP server deployment'
inputs:
  host:
    description: 'Server hostname'
    required: true
  port:
    description: 'SSH port'
    required: false
    default: '22'
  key:
    description: 'SSH private key content'
    required: true
  key-path:
    description: 'Path to store the key file'
    required: false
    default: '$HOME/.ssh/maxp_deploy_key'

runs:
  using: 'composite'
  steps:
    - name: Install SSH key
      shell: bash
      env:
        SSH_KEY: ${{ inputs.key }}
        SSH_KEY_PATH: ${{ inputs.key-path }}
      run: |
        install -m 700 -d "$HOME/.ssh"
        printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$SSH_KEY_PATH"
        chmod 600 "$SSH_KEY_PATH"

    - name: Accept host key
      shell: bash
      run: |
        ssh-keyscan -p '${{ inputs.port }}' -H '${{ inputs.host }}' >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
