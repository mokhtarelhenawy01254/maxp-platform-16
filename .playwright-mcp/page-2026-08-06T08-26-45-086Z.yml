            - heading "Volume tiers" [level=2] [ref=f45e915]
            - button [ref=f45e916] [cursor=pointer]
          - generic [ref=f45e920]: You can unlock lower utility and authentication rates based on the number of messages you send in a month.
          - generic [ref=f45e923]:
            - heading "Tiering accrual" [level=3] [ref=f45e924]
            - button [ref=f45e925] [cursor=pointer]
          - list [ref=f45e929]:
            - listitem [ref=f45e931]:
              - strong [ref=f45e932]: Messages are aggregated at the business portfolio level, across all WhatsApp Business accounts (WABAs) owned by the portfolio
              - text: — To determine what tier rates may apply in a given month for a given market–category pair, Meta aggregates messages across all of a business portfolio’s WABAs for each market-category pair (e.g., Brazil–authentication, Brazil–utility, India–authentication, and so on).
            - listitem [ref=f45e934]:
              - strong [ref=f45e935]: Only messages that are charged count toward the tiers
              - text: "— Thus, the following messages do not count:"
              - list [ref=f45e936]:
                - listitem [ref=f45e938]: Utility templates delivered to WhatsApp users within an open customer service window.
                - listitem [ref=f45e940]:
                  - text: Utility templates delivered within a
                  - link "free entry point window" [ref=f45e941] [cursor=pointer]:
                    - /url: "#free-entry-point-windows"
                  - text: .
            - listitem [ref=f45e943]:
              - strong [ref=f45e944]: Volume tiers will be determined solely by Meta
              - text: — All insights data is approximate due to small variations in data processing. Undue reliance should not be placed on insights data.
          - generic [ref=f45e947]:
            - heading "Key dynamics" [level=3] [ref=f45e948]
            - button [ref=f45e949] [cursor=pointer]
          - list [ref=f45e953]:
            - listitem [ref=f45e955]:
              - strong [ref=f45e956]: Tiers are market–category specific
              - text: — Volume tiers are aligned to our rate cards and differ by market (e.g., Brazil or Rest of Latin America) and category (utility, authentication).
            - listitem [ref=f45e958]:
              - strong [ref=f45e959]: Rates are tier-specific
              - text: — When a business sends enough messages at a given market–category pair to reach the next tier, they unlock the rate of the next tier, specifically for messages in that tier. This rate applies across all of their WABAs.
            - listitem [ref=f45e961]:
              - strong [ref=f45e962]: Tiers reset monthly
              - text: — At the start of the next month (12am WABA timezone), message count resets to 0 and businesses begin to accrue messages toward that month.
          - generic [ref=f45e965]:
            - heading "Volume tiers examples" [level=3] [ref=f45e966]
            - button [ref=f45e967] [cursor=pointer]
          - generic [ref=f45e971]:
            - text: The table below is illustrative and only highlights the dynamics of volume tiers. Please refer to our
            - link "rate cards" [ref=f45e972] [cursor=pointer]:
              - /url: "#rate-cards-and-volume-tiers"
            - text: to see the rates charged.
          - img "Table showing volume tier rate examples" [ref=f45e974] [cursor=pointer]
          - generic [ref=f45e975]: "Below are several examples to highlight how the tiers work and what is charged in a given month, for a given market–category. These examples refer to the illustrative table above:"
          - generic [ref=f45e976]: "Example 1: A business that sends a total of B authentication messages in a month to India is charged:"
          - list [ref=f45e977]:
            - listitem [ref=f45e979]: List rate for the first A messages.
            - listitem [ref=f45e981]: Tier rate 1 for messages A+1 to B.
            - listitem [ref=f45e983]: Total charges for that month = Rate per tier 𝗑 messages in each tier.
          - generic [ref=f45e984]: "Example 2: A business that starts to be charged our authentication-international rates on the 15th day of the month:"
          - list [ref=f45e985]:
            - listitem [ref=f45e987]: "Day 1 to 14 of that month: Volume tiers apply on the authentication rate."
            - listitem [ref=f45e989]: "Day 15 onward of that month: Volume tiers apply on the authentication-international rate, with messages continuing to accrue in that month. For example, if a business has already reached the Tier 2, the business would be charged Tier 2’s authentication-international rate:"
          - generic [ref=f45e990]: "Example 3: A business has 3 WABAs sending authentication messages to India. For WABA A, it is still July 31 based on their timezone. For WABAs B and C, it is already August 1 based on their timezone. For July, the business is already being charged Tier Rate 1."
          - list [ref=f45e991]:
            - listitem [ref=f45e993]: The business portfolio will be accruing toward tiers for both July (via WABA A) and August (via WABAs B, C) for a period of time.
            - listitem [ref=f45e995]: The business can reach the next tier for July, via WABA A. If that happens, messages for the remainder of July for WABA A will be charged Tier Rate 2.
          - generic [ref=f45e996]: "Example 4: A business has 3 WABAs, integrated across 2 partners. Provider 1 sends the first B messages in a given month, and provider 2 starts sending messages as of when the business is in the 3rd tier. The business does not send enough messages that month to reach the next tier. What Meta charges each provider:"
          - list [ref=f45e997]:
            - listitem [ref=f45e999]: "Provider 1: List rate for A messages, then Tier Rate 1 from A+1 to B, and Tier Rate 2 for B+1 to C."
            - listitem [ref=f45e1001]: "Provider 2: Tier Rate 2 across all of their messages."
