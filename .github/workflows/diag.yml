name: Remote Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run WhatsApp Test on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            cd /var/www/backend2
            echo "=== Running WhatsApp Test Script (correct company) ==="
            node scripts/test-direct.js 2>&1 | grep -E "Settings:|Company|Default|Session:|Result:|success|reason|No session|ERROR|Error|WHATSAPP-DEBUG|No session available|META_CLOUD|treated"
            
            echo "=== Checking latest notification logs ==="
            node -e "
              const { getSharedPrismaClient } = require('./services/sharedDatabase');
              const prisma = getSharedPrismaClient();
              async function run() {
                const logs = await prisma.\$queryRawUnsafe('SELECT status, \"eventType\", \"recipientPhone\", \"failureReason\", \"createdAt\" FROM whatsapp_notification_logs ORDER BY \"createdAt\" DESC LIMIT 5');
                console.log('LOGS:', JSON.stringify(logs));
              }
              run().catch(e => console.error(e.message)).finally(() => prisma.\$disconnect());
            " 2>&1 | grep "LOGS:"
