name: Deep Server Diagnosis

on:
  workflow_dispatch:

env:
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Deep PM2 and Port Diagnosis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deep Diagnosis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          timeout: 5m
          script: |
            echo "=== PM2 List ==="
            pm2 list

            echo ""
            echo "=== What PORT is backend using? ==="
            cd /var/www/backend2
            grep -E "^PORT=" .env.production .env 2>/dev/null || echo "No PORT found in .env files"
            
            echo ""
            echo "=== What processes listening on ports? ==="
            ss -tlnp | grep -E "3006|3007|3008|3009|3010|3011|3012" || echo "No process on those ports"
            
            echo ""
            echo "=== All listening ports (node processes) ==="
            ss -tlnp | grep node || echo "No node process listening"

            echo ""
            echo "=== Last 50 lines of backend ERROR log ==="
            tail -n 50 /var/www/backend2/logs/err.log 2>/dev/null || echo "No err.log"

            echo ""
            echo "=== Last 30 lines of PM2 backend error logs ==="
            pm2 logs maxp-backend --lines 30 --nostream --err 2>/dev/null || true

            echo ""
            echo "=== PM2 describe maxp-backend ==="
            pm2 describe maxp-backend 2>/dev/null || true

            echo ""
            echo "=== ecosystem config (if any) ==="
            cat /var/www/backend2/ecosystem.config.js 2>/dev/null | head -30 || echo "No ecosystem.config.js"

            echo ""
            echo "=== .env.production PORT and key vars ==="
            cd /var/www/backend2
            grep -E "^(PORT|DATABASE_URL|REDIS|NODE_ENV)" .env.production 2>/dev/null || echo "No .env.production"
