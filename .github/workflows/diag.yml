name: Remote Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run WhatsApp Test on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            echo "=== PM2 Status ==="
            pm2 list
            
            echo "=== Checking WhatsApp Sessions via psql ==="
            cd /var/www/backend2
            DB_URL=$(grep '^DATABASE_URL' .env.production 2>/dev/null | head -1 | cut -d'=' -f2-)
            if [ -z "$DB_URL" ]; then
              DB_URL=$(grep '^DATABASE_URL' .env 2>/dev/null | head -1 | cut -d'=' -f2-)
            fi
            echo "DB URL found: $([ -n "$DB_URL" ] && echo 'YES' || echo 'NO')"
            
            psql "$DB_URL" -c "SELECT id, name, status, \"phoneNumber\", \"companyId\", provider FROM \"WhatsAppSession\" ORDER BY \"createdAt\" DESC LIMIT 10;" 2>&1 || echo "psql failed, trying node..."
            
            echo "=== Running WhatsApp Test Script ==="
            node scripts/test-direct.js

