name: Remote Diagnosis

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run Diagnostics & Database Fix on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            echo "=== 🚀 Cleaning Size Guide Settings from DB ==="
            cd /var/www/backend2
            node -e "
            const { getSharedPrismaClientAsync } = require('./services/sharedDatabase');
            async function main() {
              const prisma = await getSharedPrismaClientAsync();
              const allSettings = await prisma.storefrontSettings.findMany();
              console.log('Total storefront settings records:', allSettings.length);
              let cleanedCount = 0;
              for (const item of allSettings) {
                let modified = false;
                const tokens = item.designTokens || {};
                if (tokens.pageOverrides?.pdp?.sections) {
                  for (const section of tokens.pageOverrides.pdp.sections) {
                    if (section.settings) {
                      if (section.settings.guideRows) { delete section.settings.guideRows; modified = true; }
                      if (section.settings.fitNote) { delete section.settings.fitNote; modified = true; }
                      if (section.settings.sizeGuideText) { delete section.settings.sizeGuideText; modified = true; }
                      if (section.settings.sizeGuideLink) { delete section.settings.sizeGuideLink; modified = true; }
                    }
                  }
                }
                if (modified) {
                  console.log('Cleaning size guide settings for company:', item.companyId);
                  await prisma.storefrontSettings.update({
                    where: { id: item.id },
                    data: { designTokens: tokens, updatedAt: new Date() }
                  });
                  cleanedCount++;
                }
              }
              console.log('Finished cleaning size guide settings. Updated companies:', cleanedCount);
            }
            main().catch(console.error).finally(() => process.exit(0));
            "
            echo "=== 🧹 Purging Redis & Backend HTML Cache ==="
            redis-cli --scan --pattern 'storefront_*' 2>/dev/null | xargs -r redis-cli del 2>/dev/null || true
            redis-cli --scan --pattern 'page_*' 2>/dev/null | xargs -r redis-cli del 2>/dev/null || true
            PURGE_SECRET="$(grep '^DEPLOY_SECRET=' /var/www/backend2/.env 2>/dev/null | cut -d= -f2-)"
            if [ -n "$PURGE_SECRET" ]; then
              curl -sS -X POST -H "x-deploy-secret: $PURGE_SECRET" "http://127.0.0.1:3007/api/v1/internal/purge-cache" || true
              curl -sS -X POST -H "x-deploy-secret: $PURGE_SECRET" "http://127.0.0.1:3008/api/v1/internal/purge-cache" || true
            fi
            echo "=== ✅ Storefront Size Guide Cleanup Completed ==="

