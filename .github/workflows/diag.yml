name: Remote Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run WhatsApp Test on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            echo "=== PM2 Status ==="
            pm2 list
            
            echo "=== Checking WhatsApp Sessions ==="
            cd /var/www/backend2
            node -e "
              const { getSharedPrismaClient } = require('./services/sharedDatabase');
              const prisma = getSharedPrismaClient();
              async function run() {
                // All sessions
                const all = await prisma.\$queryRawUnsafe('SELECT id, name, status, \"phoneNumber\", \"companyId\", provider FROM \"WhatsAppSession\" ORDER BY \"createdAt\" DESC LIMIT 10');
                console.log('ALL_SESSIONS:', JSON.stringify(all));
                
                // Connected sessions for target company
                const target = await prisma.\$queryRawUnsafe('SELECT id, name, status, \"phoneNumber\", \"companyId\", provider FROM \"WhatsAppSession\" WHERE status = \$1 AND \"companyId\" = \$2', 'CONNECTED', 'cmlcbycma0000ju8l8tcbrbby');
                console.log('TARGET_CONNECTED:', JSON.stringify(target));
                
                // All connected sessions
                const connected = await prisma.\$queryRawUnsafe('SELECT id, name, status, \"phoneNumber\", \"companyId\", provider FROM \"WhatsAppSession\" WHERE status = \$1', 'CONNECTED');
                console.log('ALL_CONNECTED:', JSON.stringify(connected));
              }
              run().catch(e => { console.error('QUERY_ERROR:', e.message); }).finally(() => prisma.\$disconnect());
            "
            
            echo "=== Running WhatsApp Test Script ==="
            node scripts/test-direct.js

