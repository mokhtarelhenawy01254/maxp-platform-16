name: Deploy to Staging (maxp.online)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Frontend Dependencies
        working-directory: ./apps/frontend
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
        env:
          HUSKY: '0'

      - name: Build Frontend
        working-directory: ./apps/frontend
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_DISABLE_COMPRESSION: 'true'
          VITE_BUILD_MINIFY: 'esbuild'

      - name: Package Frontend Build
        run: |
          tar -czf frontend-staging.tar.gz -C apps/frontend/dist .

      - name: Get Runner IP
        run: |
          echo "🌐 Runner IP: $(curl -s https://ifconfig.me)"
          echo "🎯 Target SSH Port: ${{ env.SERVER_SSH_PORT }}"

      - name: Copy Frontend Build to Server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/staging_deploy_key"
          chmod 600 "$HOME/.ssh/staging_deploy_key"
          ssh-keyscan -p "$SERVER_SSH_PORT" -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          scp -i "$HOME/.ssh/staging_deploy_key" -P "$SERVER_SSH_PORT" -o StrictHostKeyChecking=accept-new \
            frontend-staging.tar.gz "$SERVER_USER@$SERVER_HOST:~/frontend-staging.tar.gz"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          request_pty: true
          timeout: 300s
          command_timeout: 30m
          use_insecure_cipher: false
          envs: GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT
          script: |
            set -e
            DEPLOY_STAGING="$HOME/deploy_staging_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

            echo "🚀 Creating staging directory..."
            rm -rf "$DEPLOY_STAGING"

            # Pull latest changes (backend will be built on server via git)
            cd /var/www/backend-stage
            echo "📥 Pulling latest changes from staging branch..."
            git fetch origin staging
            git reset --hard origin/staging

            # Install Backend Dependencies
            echo "📦 Installing backend dependencies..."
            cd /var/www/backend-stage/backend || cd /var/www/backend-stage
            if [ -f package-lock.json ]; then
              npm ci --production --ignore-scripts
            else
              npm install --production --ignore-scripts
            fi

            # Prisma Generate & DB Push
            echo "🔄 Updating Database Schema..."
            rm -f prisma/schema/base.prisma
            npx prisma generate --schema=prisma/schema
            npx prisma db push --schema=prisma/schema --skip-generate --accept-data-loss

            # Restart Application using PM2
            echo "🔄 Restarting Node.js process using PM2..."
            pm2 restart maxp-staging || pm2 start server.js --name maxp-staging
            pm2 save

            sleep 2
            if pm2 status maxp-staging | grep -q "online"; then
              echo "✅ Backend started successfully"
            else
              echo "⚠️ Backend might not have started correctly"
              pm2 logs maxp-staging --lines 20 --no-daemon
            fi

            # Deploy Frontend build from CI
            echo "🚀 Deploying Frontend to /var/www/frontend-stage/dist..."
            if [ -f "$HOME/frontend-staging.tar.gz" ]; then
              sudo mkdir -p /var/www/frontend-stage/dist
              sudo rm -rf /var/www/frontend-stage/dist/*
              sudo tar -xzf "$HOME/frontend-staging.tar.gz" -C /var/www/frontend-stage/dist/
              sudo chown -R $USER:$USER /var/www/frontend-stage/dist
              rm -f "$HOME/frontend-staging.tar.gz"
              echo "✅ Frontend Deployed Successfully"
            else
              echo "⚠️ Frontend build archive not found, skipping"
            fi

            echo "✅ Staging Deployment Successful!"
