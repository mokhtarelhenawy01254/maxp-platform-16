<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
  <title id="title">محطات التعلّم في مختبر الذكاء الصغير</title>
  <desc id="description">روبوت صغير يرافق الطفل من المنطق إلى Scratch وPython ثم مشروع ذكاء اصطناعي.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f8fc"/>
      <stop offset="1" stop-color="#f4efff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5f3df"/>
      <stop offset="1" stop-color="#77d5b4"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" rx="36" fill="url(#surface)"/>
  <circle cx="165" cy="118" r="90" fill="#fff" opacity=".55"/>
  <circle cx="160" cy="480" r="125" fill="#fff" opacity=".38"/>
