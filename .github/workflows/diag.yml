name: Remote Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run WhatsApp Test on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            echo "=== PM2 Status ==="
            pm2 list
            
            echo "=== Checking WhatsApp Sessions ==="
            cd /var/www/backend2
            node -e "
              const { PrismaClient } = require('./prisma/generated/postgresql_v2');
              const prisma = new PrismaClient();
              async function run() {
                const sessions = await prisma.\$queryRaw\`SELECT id, name, status, \"phoneNumber\", \"companyId\", provider FROM \"WhatsAppSession\" ORDER BY \"createdAt\" DESC LIMIT 10\`;
                console.log('ALL Sessions:', JSON.stringify(sessions, null, 2));
                
                const connected = await prisma.\$queryRaw\`SELECT id, name, status, \"phoneNumber\", \"companyId\", provider FROM \"WhatsAppSession\" WHERE status = 'CONNECTED'\`;
                console.log('CONNECTED Sessions:', JSON.stringify(connected, null, 2));
                
                const settings = await prisma.\$queryRaw\`SELECT \"companyId\", \"defaultSessionId\", \"isEnabled\" FROM \"WhatsAppNotificationSettings\" LIMIT 1\`;
                console.log('Settings:', JSON.stringify(settings, null, 2));
              }
              run().catch(console.error).finally(() => prisma.\$disconnect());
            "
            
            echo "=== Running WhatsApp Test Script ==="
            node scripts/test-direct.js

