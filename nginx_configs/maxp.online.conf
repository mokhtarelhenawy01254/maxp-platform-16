server {
    server_name *.maxp.online;

    root /var/www/frontend2/dist; # Using frontend2 as per previous configs
    index index.html;

    client_max_body_size 100M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    include /etc/nginx/snippets/shortlink-preview.conf;
    include /etc/nginx/snippets/shortlink-preview-flora.conf;

    location ^~ /assets/ {
        try_files $uri =404;
        error_page 404 = @asset_not_found;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    location @asset_not_found {
        default_type text/plain;
        return 404 "/* asset not found */\n";
    }

    location ^~ /placeholders/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    # All service worker files must always reach the origin with zero cache:
    # brotli_static off: a manually-uploaded stale sw-v4.js.br must never
    # shadow the freshly deployed worker.
    location ~* ^/(sw|sw-v4|push-sw)\.js$ {
        try_files $uri =404;
        access_log off;
        brotli_static off;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    # Invalidate and prevent any PWA manifest caching
    location ~* ^/(manifest\.json|manifest\.webmanifest)$ {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        return 404;
    }

    # Direct Desktop & Mobile Downloads and Auto-Updater Assets
    location ^~ /download/ {
        alias /var/www/frontend2/dist/download/;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    location ^~ /downloads/ {
        alias /var/www/frontend2/dist/downloads/;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    # Direct Static Uploads (User avatars, task attachments, documents)
    # If image resize or format transform is requested via query params, route to backend sharp proxy
    location ^~ /uploads/ {
        if ($arg_w) {
            rewrite ^/uploads/(.*)$ /api/proxy-image?url=%2Fuploads%2F$1 last;
        }
        if ($arg_format) {
            rewrite ^/uploads/(.*)$ /api/proxy-image?url=%2Fuploads%2F$1 last;
        }
        alias /var/www/backend2/uploads/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    location ~* \.(?:css|js|mjs|map|json|webmanifest|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    # Storefront HTML must hit the backend so each company gets its own SEO metadata.
    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Subdomain $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # X-Frame-Options intentionally not set here: the landing builder
        # (maxp.online) embeds tenant storefront pages as an iframe, and the
        # backend shell CSP restricts framing to 'self' + the admin origin.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
        # Allow upstream Node.js backend to set appropriate Cache-Control (e.g. Edge caching for storefront)
        # add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # add_header Pragma "no-cache" always;
        # add_header Expires "0" always;
    }

    # Canonical API Requests
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Legacy API compatibility
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3007/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; http2 on; keepalive_requests 10000; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/maxp.online-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maxp.online-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name maxp.online www.maxp.online;

    root /var/www/frontend2/dist; # Using frontend2 as per previous configs
    index index.html;

    client_max_body_size 100M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    include /etc/nginx/snippets/shortlink-preview.conf;
    include /etc/nginx/snippets/shortlink-preview-flora.conf;

    location ^~ /assets/ {
        try_files $uri =404;
        error_page 404 = @asset_not_found_apex;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    location @asset_not_found_apex {
        default_type text/plain;
        return 404 "/* asset not found */\n";
    }

    location ^~ /placeholders/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    # Direct Desktop & Mobile Downloads and Auto-Updater Assets
    location ^~ /download/ {
        alias /var/www/frontend2/dist/download/;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    location ^~ /downloads/ {
        alias /var/www/frontend2/dist/downloads/;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    # Direct Android APK Download
    location ~* ^/(?:download|downloads)/maxp(?:[-_a-zA-Z0-9]+)?\.apk$ {
        try_files $uri /downloads/maxp.apk /download/maxp.apk =404;
        add_header Content-Disposition 'attachment; filename="MaxP.apk"' always;
        add_header Content-Type 'application/vnd.android.package-archive' always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        etag off;
        if_modified_since off;
    }

    # All service worker files must always reach the origin with zero cache:
    # brotli_static off: a manually-uploaded stale sw-v4.js.br must never
    # shadow the freshly deployed worker.
    location ~* ^/(sw|sw-v4|push-sw)\.js$ {
        try_files $uri =404;
        access_log off;
        brotli_static off;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    # Invalidate and prevent any PWA manifest caching
    location ~* ^/(manifest\.json|manifest\.webmanifest)$ {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        return 404;
    }

    location ~* \.(?:css|js|mjs|map|json|webmanifest|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    # React Frontend
    location / {
        try_files $uri /index.html;
        # brotli_static off: nginx would otherwise serve a stale index.html.br
        # (e.g. left by a manual local-build upload) INSTEAD of the fresh
        # index.html deployed by CI — every browser then gets an old build
        # referencing 404 chunks. Hashed /assets/ files keep brotli benefits
        # in their own location above.
        brotli_static off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https: 'unsafe-eval'; connect-src 'self' https: data: blob:; font-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://connect.facebook.net https://web.facebook.com;" always;
        # Ensure frontend SPA entrypoint index.html is never cached by browser or CDN
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Canonical API Requests
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Legacy API compatibility
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Direct Static Uploads (User avatars, task attachments, documents)
    location ^~ /uploads/ {
        alias /var/www/backend2/uploads/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3007/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; http2 on; keepalive_requests 10000; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/maxp.online-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maxp.online-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name maxp.online www.maxp.online *.maxp.online;
    return 301 https://$host$request_uri;
}

