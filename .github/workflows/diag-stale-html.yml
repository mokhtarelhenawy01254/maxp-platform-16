name: Diagnose Stale HTML (temporary)

# READ-ONLY diagnostics — no restarts, no file writes on the server.
# Purpose: find why https://maxp.online/ serves an index.html (mtime 08:52:54)
# that no deploy produced, referencing chunks missing from /assets/.
# Safe to delete after the investigation closes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diag-stale-html.yml'

env:
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Read-only server inspection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Wait for SSH connectivity (retry)
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            if ssh -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$SERVER_USER@$SERVER_HOST" "echo ok" >/dev/null 2>&1; then
              echo "✅ SSH reachable (attempt $i)"
              exit 0
            fi
            echo "⚠️ Attempt $i/8 failed, backing off 30s..."
            sleep 30
          done
          echo "❌ SSH unreachable from this runner after 8 attempts."
          exit 1

      - name: Run read-only diagnostics on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          command_timeout: 10m
          script: |
            set +e
            echo "════ [1] frontend2/dist/index.html stat ════"
            stat -c "%y  %s bytes  %n" /var/www/frontend2/dist/index.html
            echo
            echo "════ [2] every index.html under /var/www (top hits) ════"
            find /var/www -maxdepth 4 -name "index.html" -type f -printf "%TY-%Tm-%Td %TH:%TM:%TS  %p\n" 2>/dev/null | sort -r | head -15
            echo
            echo "════ [3] does the served entry exist? ════"
            ls -la /var/www/frontend2/dist/assets/index-B7ISSXdp.js /var/www/frontend2/dist/assets/index-BapDjTKM.js 2>&1
            echo "vendor-icons chunks on disk:"
            ls -la /var/www/frontend2/dist/assets/ 2>/dev/null | grep -E "vendor-icons" | head -5
            echo
            echo "════ [4] ACTIVE nginx config: server_name + root + location / ════"
            nginx -T 2>/dev/null | grep -nE "server_name|root |location / |try_files \\\$uri /index.html|proxy_pass http://127.0.0.1:300" | head -50
            echo
            echo "════ [5] nginx conf files mentioning maxp.online ════"
            grep -rln "maxp.online" /etc/nginx/sites-enabled/ /etc/nginx/sites-available/ /etc/nginx/conf.d/ 2>/dev/null
            echo
            echo "════ [6] open_file_cache settings ════"
            nginx -T 2>/dev/null | grep -n "open_file_cache" | head -5
            echo
            echo "════ [7] fail2ban sshd jail (root cause of deploy SSH timeouts) ════"
            sudo fail2ban-client status sshd 2>&1 | head -15
            echo
            echo "════ [8] root + deploy-user crontabs ════"
            crontab -l 2>&1 | head -20
            for u in $(ls /home 2>/dev/null); do echo "-- crontab of $u:"; sudo crontab -l -u "$u" 2>&1 | head -10; done
            echo
            echo "════ [9] old webhook deployer still alive? ════"
            ls -la /opt/deploy-webhook/ 2>&1 | head -10
            ss -tlnp 2>/dev/null | grep -E ":9001|:8081" | head -5
            echo
            echo "════ [10] pm2 apps ════"
            pm2 jlist 2>/dev/null | grep -oE '"name":"[^"]+"' | head -15
            echo
            echo "════ [11] who wrote /var/www/frontend2/dist recently (audit/atreply) ════"
            stat -c "inode=%i mtime=%y ctime=%z" /var/www/frontend2/dist/index.html
            echo "last 30 modified files under frontend2/dist:"
            find /var/www/frontend2/dist -type f -newermt "2026-08-22 08:45" -printf "%TH:%TM:%TS %p\n" 2>/dev/null | sort | tail -30
            echo
            echo "════ [12] nginx access log: recent GET / and cf hits ════"
            sudo tail -n 3000 /var/log/nginx/access.log 2>/dev/null | grep -E "GET / HTTP" | tail -8
            echo "DONE ✅"
