name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MAXP3_CHECKOUT_TOKEN || github.token }}
          fetch-depth: 2

      - name: Documentation Compliance Check
        run: node scripts/verify-docs.js

      - name: Arabic Strings Compliance Check (AGENTS.md)
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(js|ts|tsx|jsx)$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Scanning changed files: $CHANGED_FILES"
            node scripts/check-arabic-strings.js --staged $CHANGED_FILES
          else
            echo "No changed JS/TS/JSX/TSX files to scan."
          fi

      - name: Enforce AI Agent File Size Guard
        run: node scripts/check-file-sizes.js --max-kb=150

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/backend/package-lock.json

      - name: Install Backend Test Dependencies
        working-directory: ./apps/backend
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: '1'
          HUSKY: '0'

      - name: Run Facebook Ads Regression Tests
        working-directory: ./apps/backend
        run: |
          npx jest tests/controller/facebookAdsController.fullAd.test.js --runInBand --testTimeout=30000 --forceExit

      - name: Run AI Agent Test Suite
        working-directory: ./apps/backend
        run: |
          npx jest --testPathPattern="tests/services/agent|tests/services/aiChat" --runInBand --testTimeout=30000 --forceExit
        continue-on-error: true

      - name: Install Frontend Dependencies
        working-directory: ./apps/frontend
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
        env:
          HUSKY: '0'

      - name: Build Frontend (validation only)
        working-directory: ./apps/frontend
        run: |
          npm run build
          test -f dist/placeholders/luxury-shoes/hero.png
          echo "Frontend build validated"
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          VITE_DISABLE_COMPRESSION: 'true'
          VITE_BUILD_MINIFY: 'esbuild'

  deploy:
    name: Trigger Server Deploy
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Trigger deploy webhook on server
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL secret is not set"
            exit 1
          fi
          if [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "DEPLOY_WEBHOOK_SECRET secret is not set"
            exit 1
          fi

          PAYLOAD="{\"ref\":\"main\",\"run_id\":\"${{ github.run_id }}\",\"sha\":\"${{ github.sha }}\"}"
          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | awk '{print $2}')"

          echo "Sending deploy trigger to server..."
          HTTP_STATUS=$(curl -s -o /tmp/webhook_response.json -w "%{http_code}" \
            -X POST "$DEPLOY_WEBHOOK_URL/deploy" \
            -H "Content-Type: application/json" \
            -H "x-deploy-signature: $SIGNATURE" \
            --max-time 30 \
            -d "$PAYLOAD")

          echo "Response (HTTP $HTTP_STATUS):"
          cat /tmp/webhook_response.json || true

          if [ "$HTTP_STATUS" = "202" ]; then
            echo "Deploy triggered successfully. Server is pulling and deploying."
          else
            echo "Webhook returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Wait and verify health
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Waiting 90s for server to complete deployment..."
          sleep 90

          BASE_URL=$(echo "$DEPLOY_WEBHOOK_URL" | sed 's|/deploy$||')

          echo "Checking webhook server health..."
          if curl -fsS --max-time 10 "$BASE_URL/health" > /dev/null; then
            echo "Deploy webhook server is responsive"
          else
            echo "Webhook server health check failed; deploy may still be in progress"
          fi

          echo "Deployment pipeline complete"
