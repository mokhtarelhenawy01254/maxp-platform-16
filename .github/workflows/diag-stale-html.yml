name: Diagnose Stale HTML (temporary)

# READ-ONLY forensics — no restarts, no file writes on the server.
# Round 2: identify WHICH process keeps re-uploading an old build
# (index-B7ISSXdp.js-era chunks + stale .gz/.br) into /var/www/frontend2/dist
# seconds after every deploy. Safe to delete after the case closes.

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Read-only server forensics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Wait for SSH connectivity (retry)
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            if ssh -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$SERVER_USER@$SERVER_HOST" "echo ok" >/dev/null 2>&1; then
              echo "✅ SSH reachable (attempt $i)"
              exit 0
            fi
            echo "⚠️ Attempt $i/8 failed, backing off 30s..."
            sleep 30
          done
          echo "❌ SSH unreachable from this runner after 8 attempts."
          exit 1

      - name: Run read-only forensics on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          command_timeout: 10m
          script: |
            set +e
            echo "════ [A] nginx gzip_static/brotli_static? ════"
            nginx -T 2>/dev/null | grep -nE "gzip_static|brotli_static|ngx_brotli" | head -10
            echo
            echo "════ [B] bash histories mentioning frontend2/dist or phone ════"
            for h in /root/.bash_history /home/*/.bash_history; do
              [ -f "$h" ] || continue
              echo "-- $h:"
              grep -nE "frontend2/dist|phone|rsync.*frontend|scp.*frontend|dist_backup|dist.bak" "$h" 2>/dev/null | tail -25
            done
            echo
            echo "════ [C] recent logins ════"
            last -n 15 2>/dev/null | head -18
            echo
            echo "════ [D] systemd services/timers (non-default) ════"
            systemctl list-units --type=service --type=timer --no-pager 2>/dev/null | grep -vE "systemd|dbus|getty|cron.service|ssh.service|network|polkit|rsyslog|logrotate|ufw|fail2ban|nginx.service|mysql|unattended|acme|chrony|qemu|cloud" | head -25
            echo
            echo "════ [E] processes with cwd or open files under frontend2 ════"
            sudo ls -l /proc/*/cwd 2>/dev/null | grep frontend2 | head -10
            sudo find /proc/*/fd -lname "*frontend2*" -printf "%p -> %l\n" 2>/dev/null | head -10
            echo
            echo "════ [F] who owns the stale artifacts ════"
            ls -la /var/www/frontend2/dist/index.html* 2>/dev/null
            ls -la /var/www/frontend2/dist/assets/ 2>/dev/null | grep -E "index-B7|index-Bap|vendor-icons" | head -8
            echo
            echo "════ [G] sftp/scp sessions in auth log (last 3h) ════"
            sudo grep -E "Accepted|session opened" /var/log/auth.log 2>/dev/null | tail -20
            echo
            echo "════ [H] the backup dirs content (what build is in there) ════"
            for d in /var/www/frontend2/dist_backup_before_phone_lookup /var/www/frontend2/dist.bak.; do
              [ -d "$d" ] || continue
              echo "-- $d:"
              ls -la "$d" 2>/dev/null | head -8
              grep -oE "assets/index-[A-Za-z0-9_-]+\.js" "$d/index.html" 2>/dev/null | head -2
            done
            echo
            echo "════ [I] current live check ════"
            stat -c "%y %n" /var/www/frontend2/dist/index.html /var/www/frontend2/dist/index.html.gz /var/www/frontend2/dist/index.html.br 2>/dev/null
            echo "DONE ✅"
