name: Quick Nginx Fix

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  fix-nginx:
    runs-on: ubuntu-latest
    env:
      SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
    steps:
      - name: Update Nginx Configs
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          timeout: 60s
          script: |
            echo "Removing /products from frontend build to fix Nginx 403 Forbidden"
            sudo rm -rf /var/www/frontend2/dist/products || true
            
            echo "Updating try_files rule in Nginx to prevent future 403 Forbidden on nested routes..."
            sudo sed -i 's/try_files \$uri \$uri\/ \/index.html;/try_files \$uri \/index.html;/g' /etc/nginx/sites-available/maxp.online.conf || true
            sudo sed -i 's/try_files \$uri \$uri\/ \/index.html;/try_files \$uri \/index.html;/g' /etc/nginx/sites-available/maxp-ai.pro.conf || true
            sudo sed -i 's/try_files \$uri \$uri\/ \/index.html;/try_files \$uri \/index.html;/g' /etc/nginx/sites-available/mokhtarelhenawy.online.conf || true
            
            echo "Testing and Reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Nginx Fixed Successfully"
