name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع الحزمة (Build Type)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      deploy_to_server:
        description: 'نشر تلقائي للسيرفر لرابط التحميل المباشر (Deploy to maxp.online/download/maxp.apk)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Frontend Dependencies
        working-directory: apps/frontend
        run: npm ci --legacy-peer-deps

      - name: Build Web Bundle
        working-directory: apps/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_DISABLE_COMPRESSION: "true"
        run: npm run build

      - name: Sync Web Assets to Android Project
        working-directory: apps/frontend
        run: npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: apps/frontend/android
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate Generated APK
        id: apk-finder
        run: |
          APK_PATH=$(find apps/frontend/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxP-Mobile-Android-${{ github.event.inputs.build_type || 'debug' }}-${{ github.run_number }}
          path: ${{ steps.apk-finder.outputs.apk_path }}
          retention-days: 30

      - name: Setup SSH Key for Server Deployment
        if: ${{ github.event.inputs.deploy_to_server != 'false' && secrets.SERVER_HOST != '' && secrets.SERVER_SSH_KEY != '' }}
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy APK to Production Server
        if: ${{ github.event.inputs.deploy_to_server != 'false' && secrets.SERVER_HOST != '' && secrets.SERVER_SSH_KEY != '' }}
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          APK_FILE: ${{ steps.apk-finder.outputs.apk_path }}
        run: |
          echo "🚀 Deploying APK to production server..."
          ssh -4 -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p /var/www/frontend2/dist/download /var/www/frontend2/dist/downloads"

          scp -4 -i "$HOME/.ssh/maxp_deploy_key" -P "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$APK_FILE" "$SERVER_USER@$SERVER_HOST:/var/www/frontend2/dist/download/maxp.apk"

          ssh -4 -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$SERVER_USER@$SERVER_HOST" \
            "cp -f /var/www/frontend2/dist/download/maxp.apk /var/www/frontend2/dist/downloads/maxp.apk"

          echo "✅ APK successfully published to https://maxp.online/download/maxp.apk"
