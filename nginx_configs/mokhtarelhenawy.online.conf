server {
    server_name *.mokhtarelhenawy.online;

    root /var/www/frontend2/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ^~ /assets/ {
        try_files $uri =404;
        error_page 404 = @asset_not_found;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location @asset_not_found {
        default_type text/plain;
        return 404 "/* asset not found */\n";
    }

    # Invalidate and prevent any PWA manifest caching
    location ~* ^/(manifest\.json|manifest\.webmanifest)$ {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        return 404;
    }

    location ^~ /icons/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ^~ /brand/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ^~ /placeholders/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /previews/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location = /vite.svg {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Storefront HTML must hit the backend so each company gets its own SEO metadata.
    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Subdomain $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Canonical API Requests
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Legacy API compatibility
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # User-uploaded media
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3007/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mokhtarelhenawy.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mokhtarelhenawy.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

