name: Deploy to Server

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch: # للسماح بالتشغيل اليدوي

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # BUILD job — CI + نقل التاربولز لـ staging dir على السيرفر (cancelable)
  # cancel-in-progress: true — أي commit أحدث يلغي البناء القديم فورًا.
  # لو اتلغى في النص: الـ staging بيفضل جزئي بس جوب الـ deploy لن يشتغل
  # لإنه needs build + is-latest. الملفات القديمة بتتنضف age-based.
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build & Verify (cancelable)
    runs-on: ubuntu-latest
    # WHY cancel-in-progress: false here: in the old config (true), a constant
    # stream of pushes meant every build got cancelled before it could finish,
    # so deploys piled up in the queue and only the last one in a burst ever
    # actually shipped. With false, builds queue and run serially, which is
    # slower per-commit but reliable. The deploy job below still has its own
    # concurrency group that protects the live server.
    concurrency:
      group: production-build
      cancel-in-progress: false
    outputs:
      is-latest: ${{ steps.check-latest.outputs.is-latest }}
      catalog-changed: ${{ steps.cat-check.outputs.cat-changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MAXP3_CHECKOUT_TOKEN || github.token }}
          fetch-depth: 0 # full history so the build always checks out the exact pushed source

      - name: Skip if superseded by a newer commit
        id: check-latest
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "is-latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Best-effort fetch — proceed even if the fetch fails.
          git fetch --force origin main 2>/dev/null || true
          # If the fetch worked and origin/main exists, compare SHAs.
          # If anything goes wrong (fetch failed, ref missing, arithmetic
          # error), default to "proceed" — the deploy job will catch any
          # race condition and skip itself if it really is superseded.
          set +e
          LATEST=$(git rev-parse origin/main 2>/dev/null)
          set -e
          if [ -z "$LATEST" ]; then
            echo "⚠️ Could not determine latest commit (git fetch failed or origin/main missing). Proceeding with this build."
            echo "is-latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LATEST" = "${{ github.sha }}" ]; then
            echo "✅ This is the latest commit on main. Proceeding with build."
            echo "is-latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A newer commit exists. The original code skipped here unconditionally,
          # which was the root cause of "no deploy ever runs" when pushes came
          # in faster than deploys. New behavior: ALWAYS proceed. The deploy
          # job below is the one that should decide whether this specific
          # deploy should run, not this build job.
          echo "⚠️ A newer commit ($LATEST) exists on main; this build is for ${{ github.sha }}."
          echo "   Proceeding with build — deploy job will decide whether to actually run."
          echo "is-latest=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "❌ SERVER_HOST missing"; exit 1; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "❌ SERVER_USER missing"; exit 1; fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then echo "❌ SERVER_SSH_KEY missing"; exit 1; fi
          echo "✅ All secrets present"

      # 🛡️ RADICAL SAFETY GATE — full syntax check over all runtime backend files.
      # Any commit with a SyntaxError in a runtime file blocks the deploy BEFORE
      # it reaches the server (a broken commit previously crashed the backend → 502).
      - name: Full Backend Syntax Gate
        working-directory: ./apps/backend
        run: node scripts/check_syntax.js
        continue-on-error: false

      - name: Enforce AI Agent File Size Guard
        run: |
          node scripts/check-file-sizes.js --max-kb=150

      # 🛡️ Customer Portal Routing Guard — يمنع أي merge من agents تانية يرجّع
      # بوابة العميل على الـ subdomain (اعتماد دائري بيكسر المتجر). أي مخالفة => block.
      - name: Guard Customer Portal Routing
        run: node scripts/check-customer-portal-routing.js
        continue-on-error: false

      # Diff base: github.event.before covers ALL commits in a multi-commit push
      # (HEAD~1 only sees the last commit, silently skipping the rest).
      - name: Check for Facebook Ads Changes
        id: fb-check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "fb-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "fb-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          if echo "$CHANGED" | grep -qE "apps/backend/(controller/facebookAds|services/facebookAds|utils/.*facebook|tests/controller/facebookAds)"; then
            echo "fb-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fb-changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Backend-only deploys skip the frontend install/build/upload path (~70s).
      # Conservative: frontend builds whenever ANY changed path is NOT backend-only,
      # so an unexpected change still triggers the full build.
      - name: Check if Frontend Needs Rebuild
        id: fe-check
        shell: bash
        run: |
          # Always rebuild the frontend. Stale chunk detection proved unreliable
          # (partner custom-commission UI silently never shipped), so we force it.
          echo "fe-needed=true" >> "$GITHUB_OUTPUT"

      # Marketplace catalog files feed the DB via catalog:sync-target; only run it
      # when they change (it still runs on every workflow_dispatch).
      - name: Check if Marketplace Catalog Changed
        id: cat-check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "cat-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "cat-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          if echo "$CHANGED" | grep -qE "apps/backend/catalog/marketplace/|apps/backend/prisma/seeds/"; then
            echo "cat-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cat-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Backend node_modules
        if: steps.fb-check.outputs.fb-changed == 'true'
        uses: actions/cache@v4
        id: cache-backend
        with:
          path: apps/backend/node_modules
          key: backend-node-${{ hashFiles('apps/backend/package-lock.json') }}
          restore-keys: |
            backend-node-

      - name: Cache Frontend node_modules
        if: steps.fe-check.outputs.fe-needed == 'true'
        uses: actions/cache@v4
        id: cache-frontend
        with:
          path: apps/frontend/node_modules
          key: frontend-node-${{ hashFiles('apps/frontend/package-lock.json') }}-${{ hashFiles('apps/frontend/src/**/*.{ts,tsx,css,scss}') }}
          restore-keys: |
            frontend-node-

      # Only install backend deps + run the Facebook Ads regression when
      # facebook-related files actually changed — otherwise skip (saves ~56s/deploy).
      - name: Install Backend Test Dependencies
        if: steps.fb-check.outputs.fb-changed == 'true'
        working-directory: ./apps/backend
        run: |
          npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: '1'
          HUSKY: '0'
        continue-on-error: false

      - name: Strip BOM from Prisma Schema files
        if: steps.fb-check.outputs.fb-changed == 'true'
        shell: bash
        working-directory: ./apps/backend
        run: |
          # Remove UTF-8 BOM from every .prisma schema file. A BOM at the start of
          # the first line breaks `prisma generate` ("does not start with any known
          # Prisma schema keyword").
          find prisma/schema -name "*.prisma" -type f -print0 | while IFS= read -r -d '' f; do
            if [ "$(head -c3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              sed -i '1s/^\xEF\xBB\xBF//' "$f"
              echo "🧹 Stripped BOM from $f"
            fi
          done

      - name: Generate Prisma Client
        if: steps.fb-check.outputs.fb-changed == 'true'
        working-directory: ./apps/backend
        run: |
          npx prisma generate --schema=prisma/schema
        continue-on-error: false

      - name: Run Facebook Ads Regression Tests
        if: steps.fb-check.outputs.fb-changed == 'true'
        working-directory: ./apps/backend
        run: |
          npm test -- --testPathPattern="tests/controller/facebookAdsController.fullAd.test.js"
        continue-on-error: false

      # Build Frontend (skipped when only backend files changed)
      - name: Install Frontend Dependencies
        if: steps.fe-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: |
          if [ "${{ steps.cache-frontend.outputs.cache-hit }}" != 'true' ] || [ ! -f node_modules/.bin/vite ]; then
            echo "📦 Installing frontend dependencies (cache-hit=${{ steps.cache-frontend.outputs.cache-hit }}, vite-found=$(test -f node_modules/.bin/vite && echo yes || echo no))..."
            npm ci
          else
            echo "✅ Frontend dependencies restored from cache and vite binary found"
          fi
        env:
          HUSKY: '0'
        continue-on-error: false

      # 🛡️ يمنع أي "icon: X" يستخدم معرّفاً غير مستورد في src/config (كان سبب انهيار الـ dashboard)
      - name: Check Frontend Icon Imports
        if: steps.fe-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: node scripts/check-icon-imports.cjs
        continue-on-error: false

      # 🛡️ يمنع أسماء أيقونات heroicons غير موجودة في النسخة المتسطبة
      # (Loader2Icon/PackageSearchIcon كسروا build الـ vite على CI مرتين)
      - name: Check Heroicons Imports
        if: steps.fe-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: node scripts/check-heroicons.cjs
        continue-on-error: false

      - name: Build Frontend
        if: steps.fe-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: |
          # Force a clean build: drop any cached dist so stale chunks can never ship.
          rm -rf dist node_modules/.vite
          npm run build
          test -f dist/placeholders/luxury-shoes/hero.png
          echo "📂 Listing build files:"
          ls -R dist | head -n 20
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          VITE_DISABLE_COMPRESSION: 'true'
          VITE_BUILD_MINIFY: 'esbuild'
        continue-on-error: false

      - name: Validate i18n Sections
        run: node scripts/validate-i18n.js
        continue-on-error: false

      # 🛡️ يمنع الـ entry chunk من استيراد أي route chunk استيرادًا ساكنًا — الحادثة
      # دي زوّدت تحميل المتجر الأول ~2.5MB (كود المنصة كله نزل مع كل زائر متجر)
      - name: Check Entry Chunk Purity
        if: steps.fe-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: node scripts/check-entry-chunks.cjs
        continue-on-error: false

      - name: Check i18n Consistency (AR vs EN)
        run: node scripts/i18n-check.js
        continue-on-error: false

      - name: Generate i18n TypeScript Types
        run: node scripts/generate-i18n-types.js
        continue-on-error: false

      # Packaging for reliable transfer (Optimized to exclude large node_modules)
      - name: Package Assets
        env:
          FE_NEEDED: ${{ steps.fe-check.outputs.fe-needed }}
        run: |
          if [ "$FE_NEEDED" == "true" ]; then
            echo "📦 Packaging Frontend..."
            tar -czf frontend.tar.gz -C apps/frontend/dist .
            tar -czf theme-presets.tar.gz -C apps/frontend/src/storefront/themes .
          else
            echo "ℹ️ Skipping frontend tarballs (backend-only deploy)"
          fi
          tar -czf backend.tar.gz -C apps --exclude="backend/node_modules" --exclude="backend/prisma/generated" --exclude="backend/legacy_mysql" --exclude="backend/uploads" --exclude="backend/*.tar.gz" backend

          echo "📦 Packaging Shared..."
          tar -czf shared.tar.gz -C shared .

          echo "📦 Packaging AI service..."
          tar -czf ai-service.tar.gz \
            --exclude=".env" \
            --exclude=".venv" \
            --exclude="__pycache__" \
            --exclude=".pytest_cache" \
            --exclude=".ruff_cache" \
            --exclude="*.pyc" \
            -C apps ai-service

          echo "📦 Packaging Nginx configs..."
          rm -rf deploy_nginx
          mkdir -p deploy_nginx
          cp nginx_configs/maxp.online.conf deploy_nginx/maxp.online.conf
          cp nginx_configs/mokhtarelhenawy.online.conf deploy_nginx/mokhtarelhenawy.online.conf
          tar -czf nginx-configs.tar.gz -C deploy_nginx .
          rm -rf deploy_nginx

          ls -lh *.tar.gz

      # ───────────────────────────────────────────────────────────────────
      # نقل التاربولز للسيرفر (staging فقط — آمن، لا يلمس الحالة الحية)
      # ───────────────────────────────────────────────────────────────────
      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Test SSH Connection
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          # Hostinger cloud firewall / fail2ban intermittently drops runner IPs.
          # Retry so a single dropped SYN doesn't waste the whole finished build.
          for i in 1 2 3 4 5; do
            if ssh -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$SERVER_USER@$SERVER_HOST" \
              "echo '✅ SSH connection successful' && df -h \$HOME"; then
              exit 0
            fi
            echo "⚠️ SSH attempt $i/5 failed — retrying in 30s..."
            sleep 30
          done
          echo "❌ SSH unreachable after 5 attempts. Likely fail2ban/cloud-firewall ban of this runner IP."
          echo "   See apps/backend/docs/infrastructure/github-actions-ssh-firewall-2026-05-25.md"
          exit 1

      - name: Get Runner IP
        run: |
          RUNNER_IP=$(curl -s https://ifconfig.me)
          echo "🌐 GitHub Runner Public IP: $RUNNER_IP"
          echo "🎯 Target SSH Port: ${{ env.SERVER_SSH_PORT }}"

      # Setup Remote Staging Directory — التنظيف age-based عشان محدش يمسح
      # staging تبع deploy شغال في الخلفية (كانت rm -rf لكل حاجة).
      - name: Setup Remote Staging Directory
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_KEY_PATH="$HOME/.ssh/maxp_deploy_key"
          ssh -i "$SSH_KEY_PATH" -p "$SERVER_SSH_PORT" -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" '
            set -e
            echo "🧹 Cleaning stale staging dirs (older than 1 day)..."
            find $HOME -maxdepth 1 -name "deploy_staging_*" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
            sudo rm -rf /tmp/deploy_staging_* /tmp/*.tar.gz /tmp/*.bak 2>/dev/null || true
            sudo journalctl --vacuum-time=1d 2>/dev/null || true
            pm2 flush 2>/dev/null || true

            DEPLOY_STAGING="$HOME/deploy_staging_${{ github.run_id }}"
            echo "🚀 Creating staging directory: $DEPLOY_STAGING"
            rm -rf "$DEPLOY_STAGING"
            mkdir -p "$DEPLOY_STAGING/backend"
            mkdir -p "$DEPLOY_STAGING/frontend"
            echo "✅ Staging directory created."
            echo "📊 Free disk space on server:"
            df -h $HOME
          '

      # Deploy Tarballs to Server
      - name: Deploy Tarballs to Server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_KEY_PATH="$HOME/.ssh/maxp_deploy_key"
          ssh-keyscan -p "$SERVER_SSH_PORT" -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          for i in 1 2 3; do
            echo "🔄 SCP attempt $i/3..."
            if timeout 30m scp \
              -i "$SSH_KEY_PATH" \
              -P "$SERVER_SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o ConnectTimeout=30 \
              *.tar.gz \
              "$SERVER_USER@$SERVER_HOST:deploy_staging_${{ github.run_id }}/"; then
              echo "✅ Tarballs transferred successfully"
              break
            else
              echo "⚠️ SCP attempt $i failed"
              if [ $i -eq 3 ]; then
                echo "❌ All SCP attempts failed"
                exit 1
              fi
              sleep 5
            fi
          done

          echo "📋 Copying deployment script..."
          scp -i "$SSH_KEY_PATH" -P "$SERVER_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            scripts/deploy-remote.sh \
            "$SERVER_USER@$SERVER_HOST:deploy_staging_${{ github.run_id }}/deploy-remote.sh"

  # ═══════════════════════════════════════════════════════════════════
  # DEPLOY job — ينفذ deploy-remote.sh على السيرفر فقط (never cancel)
  # cancel-in-progress: false — الديبلوي اللي شغال لازم يخلص من غير ما
  # يتقطع في النص (npm prune / prisma migrate / pm2 restart).
  # الـ pending الأقدم بيتلغي أوتوماتيك لصالح الأحدث (سلوك GitHub الافتراضي).
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Server (never cancel)
    runs-on: ubuntu-latest
    needs: build
    # مش هينضاف للطابور غير لما الـ build يكون هو الأحدث على main.
    if: needs.build.outputs.is-latest == 'true'
    concurrency:
      group: production-deploy-apply
      cancel-in-progress: false
    timeout-minutes: 150

    steps:
      - name: Skip deploy if superseded while waiting in queue
        id: check-deploy-latest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Previous version of this step had a serious bug: it tried to compute
          # LATEST_AGE by running `git log -1 --format=%ct origin/main`, but the
          # deploy job's `actions/checkout@v5` step happens AFTER this one and
          # uses a shallow clone (fetch-depth=1) with no remote refs. So
          # `origin/main` doesn't exist yet, the git log fails, the fallback
          # in `$()` returns the current time, LATEST_AGE = 0, and the
          # `> 300` check is false → the deploy is skipped. With the previous
          # code, EVERY deploy attempt silently skipped itself.
          #
          # The fix: don't try to compute a timestamp at all. The deploy job
          # only needs to know "am I safe to run or am I being raced by a
          # newer commit". Use the API to compare SHAs. If the API fails,
          # proceed anyway (deploying a slightly-stale commit beats deploying
          # nothing). If the SHA on main differs from this build's SHA, log
          # a warning and proceed — the newer commit's deploy will run after
          # this one in the queue.
          set +e
          LATEST=$(curl -s -m 15 -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null)
          set -e
          if [ -z "$LATEST" ]; then
            echo "⚠️ Could not determine latest commit (API call failed or empty). Proceeding anyway — better to deploy than to stall."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LATEST" = "${{ github.sha }}" ]; then
            echo "✅ This build is the latest commit on main. Proceeding with deploy."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A newer commit exists. The original code would skip here, which
          # was the actual cause of the "no deploy ever runs" bug. Instead
          # we proceed and let the queue handle ordering — the newer
          # commit's deploy will follow this one and ship its own changes.
          echo "⚠️ A newer commit ($LATEST) exists on main. This build is for ${{ github.sha }}."
          echo "   Proceeding with this deploy anyway — the newer commit's deploy will follow in the queue."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      # Hostinger cloud firewall / fail2ban intermittently drops runner IPs —
      # historically the #1 cause of deploy failures (dial tcp timeout).
      # Probe with retries BEFORE appleboy so a transient drop doesn't kill the deploy.
      - name: Wait for SSH connectivity (retry)
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if ssh -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$SERVER_USER@$SERVER_HOST" "echo ok" >/dev/null 2>&1; then
              echo "✅ SSH reachable (attempt $i)"
              exit 0
            fi
            echo "⚠️ Attempt $i/6 failed, backing off 30s..."
            sleep 30
          done
          echo "❌ SSH unreachable from this runner after 6 attempts over ~3 minutes."
          echo "   This matches the known fail2ban/Hostinger-firewall IP-ban pattern."
          exit 1

      - name: Run Deployment Script on Server
        if: steps.check-deploy-latest.outputs.proceed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          CATALOG_CHANGED: ${{ needs.build.outputs.catalog-changed }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          timeout: 60m
          command_timeout: 50m
          envs: GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,SUPER_ADMIN_EMAIL,SUPER_ADMIN_PASSWORD,CATALOG_CHANGED
          script: |
            set -e
            sudo -n true || {
              echo "❌ Passwordless sudo is required for production deploys"
              exit 1
            }
            export DEPLOY_STAGING="$HOME/deploy_staging_${GITHUB_RUN_ID}"
            exec 9>/tmp/maxp-production-deploy.lock
            if ! flock -n 9; then
              echo "❌ Another production deployment is already running on the server"
              exit 1
            fi
            bash "$DEPLOY_STAGING/deploy-remote.sh"
