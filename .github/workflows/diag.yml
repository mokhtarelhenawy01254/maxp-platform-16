name: Remote Diagnosis

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run Diagnostics & Database Fix on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            echo "=== 🚀 Running Storefront Brand Name Database Sync ==="
            cd /var/www/backend2
            PGPASSWORD=mokhtar1234 psql -h localhost -U appuser -d maxp -c "
              UPDATE storefront_settings 
              SET \"designTokens\" = '{\"themeId\": \"khemet-luxe-eg\", \"currency\": \"EGP\", \"storeName\": \"TATO\"}',
                  \"updatedAt\" = NOW()
              WHERE \"companyId\" = 'cmtk4862e0sq6judiubpvklni';
            "
            echo "=== 🧹 Purging Redis & Backend HTML Cache ==="
            redis-cli --scan --pattern 'storefront_settings:*' 2>/dev/null | xargs -r redis-cli del 2>/dev/null || true
            PURGE_SECRET="$(grep '^DEPLOY_SECRET=' /var/www/backend2/.env 2>/dev/null | cut -d= -f2-)"
            if [ -n "$PURGE_SECRET" ]; then
              curl -sS -X POST -H "x-deploy-secret: $PURGE_SECRET" "http://127.0.0.1:3007/api/v1/internal/purge-cache" || true
            fi
            echo "=== ✅ Storefront Brand Name Database Sync Completed ==="

