name: Mirror to maxp4

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to mirror'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - staging
          - all

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all branches and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure destination remote with PAT
        env:
          DEST_PAT: ${{ secrets.DEST_PAT }}
        run: |
          git config --global url."https://x-access-token:${DEST_PAT}@github.com/".insteadOf "https://github.com/"
          git remote add dest https://github.com/mokhtarelhenawy091-crypto/maxp-platform-12.git

      - name: Push to destination
        run: |
          case "${{ github.event.inputs.scope }}" in
            main)
              git push --force --tags dest 'refs/remotes/origin/main:refs/heads/main'
              ;;
            staging)
              git push --force --tags dest 'refs/remotes/origin/staging:refs/heads/staging'
              ;;
            all)
              git push --force --prune --tags dest 'refs/remotes/origin/*:refs/heads/*'
              ;;
          esac
