<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-96x96.png" type="image/png" sizes="96x96" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
  <meta name="description" content="منصة متكاملة لإدارة التواصل والتجارة الإلكترونية للشركات" />
  <meta name="keywords"
    content="تواصل, إدارة عملاء, تجارة إلكترونية, ذكاء اصطناعي, فيسبوك ماسنجر, posts management, ai tracking" />
  <meta name="author" content="Communication Platform" />
  <meta name="google" content="notranslate" />
  <meta name="notranslate" content="on" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="MaxP — منصة إدارة التواصل والتجارة الإلكترونية" />
  <meta property="og:description" content="منصة متكاملة لإدارة المحادثات، الذكاء الاصطناعي، والمتاجر الرقمية في مكان واحد." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://maxp.online" />
  <link rel="canonical" href="https://maxp.online" />
  <meta property="og:image" content="https://maxp.online/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="MaxP" />
  <meta property="og:locale" content="ar_AR" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@maxponline" />
  <meta name="twitter:title" content="MaxP — منصة إدارة التواصل والتجارة الإلكترونية" />
  <meta name="twitter:description" content="منصة متكاملة لإدارة المحادثات، الذكاء الاصطناعي، والمتاجر الرقمية في مكان واحد." />
  <meta name="twitter:image" content="https://maxp.online/og-cover.png" />

  <!-- Browser chrome theme color -->
  <meta name="theme-color" content="#3B82F6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: dark)" />

  <!-- Preconnect to critical origins for faster first request -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <!-- Core application fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" />

  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

  <title>MaxP — منصة إدارة التواصل والتجارة الإلكترونية</title>

  <!-- Critical CSS (inline for performance) -->
  <style>
    * {
      box-sizing: border-box
    }

    html {
      font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      tab-size: 4;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #f9fafb;
      color: #111827;
      font-family: inherit;
      line-height: inherit;
      margin: 0;
    }

    /* RTL Arabic Typography Guard: Prevent wide letter-spacing or uppercase breaks on cursive Arabic text */
    [dir="rtl"] {
      font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    [dir="rtl"], [dir="rtl"] * {
      letter-spacing: normal !important;
      text-transform: none;
    }

    .loading-spinner {
      animation: spin 1s ease-in-out infinite;
      border: 3px solid #f3f4f6;
      border-radius: 50%;
      border-top-color: #3b82f6;
      display: inline-block;
      height: 40px;
      width: 40px
    }

    @keyframes spin {
      to {
        transform: rotate(1turn)
      }
    }

    #initial-loading {
      background-color: #fff;
      flex-direction: column;
      height: 100%;
      left: 0;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #initial-loading .spinner-container {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-spinner {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid #f3f4f6;
      border-top: 2px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.55, 0.055, 0.675, 0.19) infinite;
    }

    .loading-pulse {
      width: 40px;
      height: 40px;
      background-color: #3b82f6;
      border-radius: 50%;
      opacity: 0.1;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(1turn);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.2;
      }
    }

    #initial-loading .text {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 24px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .app-ready #initial-loading {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Language-specific styles */
    [dir="rtl"] #initial-loading .text {
      font-family: inherit;
      letter-spacing: 0;
    }

    /* Storefront initial loading styles - clean, seamless, zero-flicker */
    #initial-loading.storefront-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      color: #111827;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 0;
      margin: 0;
      transition: opacity 0.2s ease-out, visibility 0.2s ease-out;
    }

    .storefront-loading .storefront-spinner {
      width: 32px;
      height: 32px;
      border: 2.5px solid #e5e7eb;
      border-top-color: #111827;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.55, 0.055, 0.675, 0.19) infinite;
    }
  </style>
  <!-- Must run BEFORE the maxp-preload-shell-chain inline script (injected into
       the end of head at build time) so __MAXP_IS_STOREFRONT__ is already set
       when the shell-preload decision is made. Runs at body-end originally,
       which was too late for that check and swapped the loader style late. -->
  <script src="/js/storefront-detection.js"></script>
</head>

<body>
  <!-- Initial loading screen - Neutral and professional -->
  <div id="initial-loading">
    <div class="spinner-container">
      <div class="loading-spinner"></div>
      <div class="loading-pulse"></div>
    </div>
    <div class="text">جاري التحميل...</div>
  </div>

  <noscript>
    <div style="background:#f9fafb;color:#111827;padding:40px;text-align:center;font-family:UI,sans-serif">
      <h2>تم تعطيل JavaScript</h2>
      <p>للاستفادة من كل مميزات منصة MaxP، يُرجى تفعيل JavaScript في المتصفح.</p>
      <p>يمكنك تصفح المحتوى الأساسي، ولكن بعض الميزات قد لا تعمل.</p>
    </div>
  </noscript>

  <!--
    Service worker management is handled by the React app (main.tsx).
    Legacy workers are automatically unregistered on startup.
  -->

  <!-- React app root -->
  <div id="root"></div>

  <!--
    Non-critical font loading removed.
    Theme-specific fonts are now loaded dynamically by ThemeProvider
    based on the active theme's headingFont/bodyFont configuration.
    This avoids loading all 11 Google Fonts for every store visit.
  -->

  <!-- Module script will be injected by Vite -->
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
