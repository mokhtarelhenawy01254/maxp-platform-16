name: Run Swan Yasmine Test Scenario

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Swan Admin Password (or set in secrets.SWAN_ADMIN_PASSWORD)'
        required: false
        type: string

jobs:
  run-test:
    name: Execute Yasmine simulation scenario on production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Execute test script on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          PASSWORD: ${{ github.event.inputs.password || secrets.SWAN_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          envs: PASSWORD
          script: |
            set -euo pipefail
            cd /var/www/backend2
            echo "📍 Current dir: $(pwd)"
            echo "🚀 Running test-swan-yasmine.js..."
            node scripts/test-swan-yasmine.js
            echo "✅ Finished!"
