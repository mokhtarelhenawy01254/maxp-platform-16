<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" id="metaThemeColor" />
  <title>MaxP Portal</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <div id="offlineBanner" class="offline-banner hidden" role="alert">
      <div class="offline-copy">
        <strong>لا يوجد اتصال بالإنترنت</strong>
        <span>تحقق من الشبكة ثم أعد المحاولة.</span>
      </div>
      <button id="retryBtn" type="button" class="btn btn-sm">إعادة المحاولة</button>
    </div>

    <div id="updateBanner" class="update-banner hidden" role="region" aria-label="تحديث التطبيق">
      <div class="update-copy">
        <strong id="updateTitle">تحديث متاح</strong>
      </div>
      <div class="update-actions">
        <a id="updateDownloadLink" class="btn btn-sm update-btn" href="#" target="_blank" rel="noopener noreferrer">تحديث</a>
        <button id="updateDismissBtn" type="button" class="update-dismiss" aria-label="إغلاق">×</button>
      </div>
    </div>

    <section id="savedView" class="card saved-card hidden" aria-live="polite">
      <div class="brand-mark" id="savedAvatar">M</div>
      <span class="badge" id="savedCodeBadge"></span>
      <h1 id="savedTitle" class="title">جارٍ فتح البوابة…</h1>
      <p id="savedSubtitle" class="subtitle"></p>
      <div class="loader-bar" aria-hidden="true"><span></span></div>
      <div class="actions-stack">
        <button id="openSavedBtn" type="button" class="btn btn-primary">فتح البوابة الآن</button>
        <button id="switchTenantBtn" type="button" class="btn btn-ghost">تغيير المركز / المؤسسة</button>
      </div>
    </section>

    <section id="connectView" class="card connect-card">
      <header class="card-header">
        <div class="logo-wrap" id="brandIcon">
          <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect x="4" y="4" width="56" height="56" rx="14" stroke="currentColor" stroke-width="3"/>
            <path d="M19 43V21l13 11 13-11v22" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="32" cy="43" r="3" fill="currentColor"/>
          </svg>
        </div>
        <div class="header-text">
          <span id="flavorBadge" class="badge">MaxP</span>
          <h1 id="appTitle" class="title">اربط حسابك بالمؤسسة</h1>
          <p id="appSubtitle" class="subtitle">أدخل كود المؤسسة أو ابحث بالاسم.</p>
        </div>
      </header>

      <div id="directPrimaryWrap" class="direct-primary hidden">
        <button id="directPrimaryBtn" type="button" class="btn btn-primary btn-lg">فتح البوابة مباشرة</button>
      </div>

      <form id="lookupForm" class="lookup-form" novalidate>
        <label for="lookupInput" class="field-label">كود المؤسسة أو الاسم</label>
        <div class="input-row">
          <input
            id="lookupInput"
            class="input"
            type="text"
            inputmode="search"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="مثال: SWAN01"
          />
          <button id="lookupBtn" type="submit" class="btn btn-primary">بحث</button>
        </div>
      </form>

      <div id="portalPickerWrap" class="portal-picker hidden">
        <span class="field-label">نوع البوابة</span>
        <div id="portalPills" class="portal-pills" role="radiogroup" aria-label="اختيار البوابة"></div>
      </div>

      <p id="statusMsg" class="status-msg hidden" role="status"></p>

      <div id="resultsList" class="results-list" aria-live="polite"></div>

      <footer class="card-footer">
        <button id="directFallbackBtn" type="button" class="btn btn-outline">
          تسجيل الدخول عبر الرقم على المنصة مباشرة (maxp.online)
        </button>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
