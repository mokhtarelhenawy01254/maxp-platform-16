name: Run backend one-off script (WhatsApp cleanup)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  run-script:
    name: Run one-off WhatsApp cleanup on server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Upload script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: apps/backend/scripts/one-off/cleanup-duplicate-whatsapp-session.js
          target: /var/www/backend2/scripts/one-off/
          strip_components: 4
          overwrite: true

      - name: Execute migration script on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/backend2
            echo "Current backend dir: $(pwd)"
            ls -la scripts/one-off/cleanup-duplicate-whatsapp-session.js
            node scripts/one-off/cleanup-duplicate-whatsapp-session.js
