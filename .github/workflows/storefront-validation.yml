name: Storefront Validation

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

env:
  NODE_VERSION: "20"

concurrency:
  group: storefront-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Storefront Safety Nets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./apps/backend
        run: npm ci

      - name: Backend Syntax Check
        working-directory: ./apps/backend
        run: npm run check:syntax

      - name: Backend Template Validation
        working-directory: ./apps/backend
        run: npm run templates:validate -- --fail-on-critical-warnings

      - name: Install Frontend Dependencies
        working-directory: ./apps/frontend
        run: npm ci

      - name: Frontend Storefront Theme Validation
        working-directory: ./apps/frontend
        run: npm run validate:themes

      - name: Install Playwright Chromium
        working-directory: ./apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Start Frontend Preview Server
        working-directory: ./apps/frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 3001 > /tmp/storefront-preview.log 2>&1 &
          echo $! > /tmp/storefront-preview.pid

      - name: Wait For Frontend Preview Server
        run: |
          for attempt in {1..90}; do
            if curl --silent --fail "http://127.0.0.1:3001/store/?companyId=company123&previewSource=marketplace&previewTheme=pc-hub-eg" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend preview server did not start in time."
          cat /tmp/storefront-preview.log || true
          exit 1

      - name: Frontend Storefront Routing Test
        working-directory: ./apps/frontend
        run: npm run test:storefront-routing

      - name: Frontend Storefront Centering Audit (390px)
        working-directory: ./apps/frontend
        run: npm run audit:storefront-centering -- --widths 390 --base-url http://127.0.0.1:3001

      - name: Frontend Storefront Centering Audit (1440px)
        working-directory: ./apps/frontend
        run: npm run audit:storefront-centering -- --widths 1440 --base-url http://127.0.0.1:3001

      - name: Frontend Storefront Centering Audit (2200px)
        working-directory: ./apps/frontend
        run: npm run audit:storefront-centering -- --widths 2200 --base-url http://127.0.0.1:3001

      - name: Stop Frontend Preview Server
        if: always()
        run: |
          if [ -f /tmp/storefront-preview.pid ]; then
            kill "$(cat /tmp/storefront-preview.pid)" || true
          fi

      - name: Upload Frontend Preview Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-preview-log
          path: /tmp/storefront-preview.log
          if-no-files-found: ignore
