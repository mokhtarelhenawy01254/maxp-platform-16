name: Remote Diagnosis

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run Diagnostics & Database Fix on Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            echo "=== 🔍 Inspecting Product mlabs-nsaeyh-1788425645 in DB ==="
            cd /var/www/backend2
            node -e "
            const { getSharedPrismaClientAsync } = require('./services/sharedDatabase');
            async function main() {
              const prisma = await getSharedPrismaClientAsync();
              const product = await prisma.product.findFirst({
                where: {
                  OR: [
                    { slug: 'mlabs-nsaeyh-1788425645' },
                    { id: 'mlabs-nsaeyh-1788425645' },
                    { handle: 'mlabs-nsaeyh-1788425645' }
                  ]
                }
              });
              console.log('PRODUCT RECORD:', JSON.stringify(product, null, 2));
              if (product && product.sizeGuide) {
                console.log('Product sizeGuide content length:', product.sizeGuide.length);
                console.log('Product sizeGuide RAW:', JSON.stringify(product.sizeGuide));
              }
            }
            main().catch(console.error).finally(() => process.exit(0));
            "
            echo "=== 🧹 Purging Redis & Backend HTML Cache ==="
            redis-cli --scan --pattern 'storefront_*' 2>/dev/null | xargs -r redis-cli del 2>/dev/null || true
            redis-cli --scan --pattern 'page_*' 2>/dev/null | xargs -r redis-cli del 2>/dev/null || true
            PURGE_SECRET="$(grep '^DEPLOY_SECRET=' /var/www/backend2/.env 2>/dev/null | cut -d= -f2-)"
            if [ -n "$PURGE_SECRET" ]; then
              curl -sS -X POST -H "x-deploy-secret: $PURGE_SECRET" "http://127.0.0.1:3007/api/v1/internal/purge-cache" || true
              curl -sS -X POST -H "x-deploy-secret: $PURGE_SECRET" "http://127.0.0.1:3008/api/v1/internal/purge-cache" || true
            fi
            echo "=== ✅ Storefront Size Guide Cleanup Completed ==="

