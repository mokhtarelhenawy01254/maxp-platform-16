apply plugin: 'com.android.application'

android {
    namespace = "online.maxp.portalshell"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    flavorDimensions "portal"
    productFlavors {
        parent {
            dimension "portal"
            applicationId "online.maxp.parent"
            versionCode 1
            versionName "1.0.0"
            resValue "string", "app_name", "بوابة ولي الأمر - MaxP"
            resValue "string", "title_activity_main", "بوابة ولي الأمر - MaxP"
            resValue "string", "custom_url_scheme", "online.maxp.parent"
            manifestPlaceholders = [deepLinkHost: "maxp.online", deepLinkPrefix: "/i"]
            buildConfigField "String", "PORTAL_FLAVOR", '"parent"'
        }
        portal {
            dimension "portal"
            applicationId "online.maxp.portal"
            versionCode 1
            versionName "1.0.0"
            resValue "string", "app_name", "بوابات MaxP"
            resValue "string", "title_activity_main", "بوابات MaxP"
            resValue "string", "custom_url_scheme", "online.maxp.portal"
            manifestPlaceholders = [deepLinkHost: "maxp.online", deepLinkPrefix: "/i"]
            buildConfigField "String", "PORTAL_FLAVOR", '"portal"'
        }
        courier {
            dimension "portal"
            applicationId "online.maxp.courier"
            versionCode 1
            versionName "1.0.0"
            resValue "string", "app_name", "مندوب ماكس بي"
            resValue "string", "title_activity_main", "مندوب ماكس بي"
            resValue "string", "custom_url_scheme", "online.maxp.courier"
            manifestPlaceholders = [deepLinkHost: "maxp.online", deepLinkPrefix: "/courier-portal"]
            buildConfigField "String", "PORTAL_FLAVOR", '"courier"'
        }
        customer {
            dimension "portal"
            applicationId "online.maxp.customer"
            versionCode 1
            versionName "1.0.0"
            resValue "string", "app_name", "ماكس بي للشحن والعملاء"
            resValue "string", "title_activity_main", "ماكس بي للشحن والعملاء"
            resValue "string", "custom_url_scheme", "online.maxp.customer"
            manifestPlaceholders = [deepLinkHost: "maxp.online", deepLinkPrefix: "/client-portal"]
            buildConfigField "String", "PORTAL_FLAVOR", '"customer"'
        }
    }

    signingConfigs {
        release {
            def keystoreFile = file("maxp-portal-release.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "maxp2026"
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "maxp"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "maxp2026"
            }
        }
    }

    buildTypes {
        release {
            if (file("maxp-portal-release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
