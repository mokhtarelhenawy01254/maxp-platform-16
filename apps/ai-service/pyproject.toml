[project]
name = "maxp-ai-service"
version = "0.2.0"
description = "MaxP AI Service - FastAPI service powered by Microsoft Agent Framework"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [
    { name = "MaxP Engineering" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "anthropic>=0.39",
    "openai>=1.55",
    "python-multipart>=0.0.20",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b",
    "opentelemetry-instrumentation-httpx>=0.49b",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b",
    "sentry-sdk>=2.18",
    "redis>=5.2",
    "rq>=2.1",
    "psycopg2-binary>=2.9",
    "google-genai>=2.10",
    "mcp>=1.2",
    "telethon>=1.35",
    "aiogram>=3.0",
    "agent-framework==1.22.0",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers>=4.8",
]
agents = [
    "agent-framework>=1.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ai-worker = "src.workers.main:main"
ai-agent-worker = "src.workers.agent_worker:run_worker_sync"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "live: tests that call real LLM APIs (deselected by default, run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]
"migrations/**/*.py" = ["E", "F", "I", "N", "UP", "B"]
"src/intent/schema.py" = ["N815"]
"src/db/models/ai_setting.py" = ["N815"]
"src/db/models/faq.py" = ["N815"]
"src/db/models/policy.py" = ["N815"]
"src/db/models/product.py" = ["N815"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["agent_framework.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.api.middleware", "src.observability.errors", "src.observability.audit", "src.observability.metrics", "src.observability.tracing"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["src.db.models.*", "src.api.admin.schemas", "src.observability.pii", "src.tools.registry"]
no_implicit_optional = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["src.db.session", "src.deps"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.agents.*", "src.workflows.support_flow"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.agents.ceo", "src.observability.metrics"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.api.middleware"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
check_untyped_defs = false

