<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="منصة متكاملة لإدارة التواصل والتجارة الإلكترونية للشركات" />
  <meta name="keywords"
    content="تواصل, إدارة عملاء, تجارة إلكترونية, ذكاء اصطناعي, فيسبوك ماسنجر, posts management, ai tracking" />
  <meta name="author" content="Communication Platform" />
  <meta name="google" content="notranslate" />
  <meta name="notranslate" content="on" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="منصة إدارة التواصل والتجارة الإلكترونية" />
  <meta property="og:description" content="منصة شاملة تجمع بين إدارة التواصل مع العملاء والتجارة الإلكترونية" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://maxp.online" />
  <meta property="og:image" content="/assets/themes/elegant-luxe/preview.png" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="منصة إدارة التواصل والتجارة الإلكترونية" />
  <meta name="twitter:description" content="منصة شاملة تجمع بين إدارة التواصل مع العملاء والتجارة الإلكترونية" />
  <meta name="twitter:image" content="/assets/themes/elegant-luxe/preview.png" />

  <!-- Preconnect to API server for faster first request -->
  <link rel="preconnect" href="https://maxp.online" crossorigin />
  <link rel="dns-prefetch" href="https://maxp.online" />

  <!--
    Storefront font loading is route-aware:
    - admin shell fonts are injected only for admin routes in main.tsx
    - storefront theme fonts are injected by ThemeProvider with display=optional
  -->

  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

  <title>منصة إدارة التواصل والتجارة الإلكترونية</title>

  <!-- Critical CSS (inline for performance) -->
  <style>
    * {
      box-sizing: border-box
    }

    html {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Tahoma, Arial, sans-serif;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      tab-size: 4
    }

    body {
      background-color: #f9fafb;
      color: #111827;
      font-family: inherit;
      line-height: inherit;
      margin: 0
    }

    .loading-spinner {
      animation: spin 1s ease-in-out infinite;
      border: 3px solid #f3f4f6;
      border-radius: 50%;
      border-top-color: #3b82f6;
      display: inline-block;
      height: 40px;
      width: 40px
    }

    @keyframes spin {
      to {
        transform: rotate(1turn)
      }
    }

    #initial-loading {
      background-color: #fff;
      flex-direction: column;
      height: 100%;
      left: 0;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #initial-loading .spinner-container {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-spinner {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid #f3f4f6;
      border-top: 2px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.55, 0.055, 0.675, 0.19) infinite;
    }

    .loading-pulse {
      width: 40px;
      height: 40px;
      background-color: #3b82f6;
      border-radius: 50%;
      opacity: 0.1;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(1turn);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.2;
      }
    }

    #initial-loading .text {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 24px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .app-ready #initial-loading {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Language-specific styles */
    [dir="rtl"] #initial-loading .text {
      font-family: inherit;
      letter-spacing: 0;
    }

    /* Storefront initial skeleton styles */
    #initial-loading.storefront-loading {
      display: block;
      background-color: #ffffff;
      color: #111827;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }

    .storefront-loading .skeleton-pulse {
      animation: skeleton-pulse-anim 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      background-color: #f3f4f6;
    }

    @keyframes skeleton-pulse-anim {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: .4;
      }
    }

    .storefront-loading .skeleton-header {
      height: 80px;
      width: 100%;
      border-bottom: 1px solid rgba(229, 231, 235, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-sizing: border-box;
    }

    .storefront-loading .skeleton-logo {
      height: 32px;
      width: 120px;
      border-radius: 4px;
    }

    .storefront-loading .skeleton-nav {
      display: none;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .storefront-loading .skeleton-nav {
        display: flex;
      }
    }

    .storefront-loading .skeleton-nav-item {
      height: 16px;
      width: 64px;
      border-radius: 4px;
    }

    .storefront-loading .skeleton-actions {
      display: flex;
      gap: 16px;
    }

    .storefront-loading .skeleton-icon {
      height: 32px;
      width: 32px;
      border-radius: 50%;
    }

    .storefront-loading .skeleton-main {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 80px);
      overflow: hidden;
    }

    .storefront-loading .skeleton-hero {
      height: 35vh;
      min-height: 250px;
      width: 100%;
    }

    .storefront-loading .skeleton-container {
      padding: 32px 24px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .storefront-loading .skeleton-title {
      height: 24px;
      width: 180px;
      border-radius: 4px;
      margin-bottom: 24px;
    }

    .storefront-loading .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 768px) {
      .storefront-loading .skeleton-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
      }
    }

    .storefront-loading .skeleton-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .storefront-loading .skeleton-card-media {
      aspect-ratio: 3/4;
      width: 100%;
      border-radius: 8px;
    }

    .storefront-loading .skeleton-card-title {
      height: 16px;
      width: 75%;
      border-radius: 4px;
    }

    .storefront-loading .skeleton-card-price {
      height: 16px;
      width: 50%;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <!-- Initial loading screen - Neutral and professional -->
  <div id="initial-loading">
    <div class="spinner-container">
      <div class="loading-spinner"></div>
      <div class="loading-pulse"></div>
    </div>
    <div class="text">جاري التحميل...</div>
  </div>

  <script src="/js/storefront-detection.js"></script>

  <!-- React app root -->
  <div id="root"></div>

  <!--
    Non-critical font loading removed.
    Theme-specific fonts are now loaded dynamically by ThemeProvider
    based on the active theme's headingFont/bodyFont configuration.
    This avoids loading all 11 Google Fonts for every store visit.
  -->

  <script src="/js/chunk-recovery.js"></script>

  <!-- Module script will be injected by Vite -->
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
