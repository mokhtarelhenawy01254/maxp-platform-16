name: Deploy to Server

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'memory/**'
      - 'docs/**'
      - 'ACADEMY_SEED_REQUEST.json'
      - '.github/workflows/academy-seed.yml'
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: 'Force full rebuild and re-install of all components'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # BUILD job — CI + نقل التاربولز لـ staging dir على السيرفر (cancelable)
  # cancel-in-progress: true — أي commit أحدث يلغي البناء القديم فورًا.
  # لو اتلغى في النص: الـ staging بيفضل جزئي بس جوب الـ deploy لن يشتغل
  # لإنه needs build + is-latest. الملفات القديمة بتتنضف age-based.
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build & Verify (cancelable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-build
      # cancel-in-progress: false (was true) — when the team pushes
      # frequently, true caused every new build to kill the previous
      # one before it could finish, so deploys piled up in the
      # queue and only the last one in a burst actually shipped.
      # False makes builds queue and run serially. The deploy job
      # below still has its own concurrency group at
      # cancel-in-progress: false, so the live server stays safe.
      cancel-in-progress: false
    outputs:
      is-latest: ${{ steps.check-latest.outputs.is-latest }}
      catalog-changed: ${{ steps.diff-check.outputs.cat-changed }}
      fe-needed: ${{ steps.diff-check.outputs.fe-needed }}
      backend-deps-changed: ${{ steps.diff-check.outputs.backend-deps-changed }}
      prisma-changed: ${{ steps.diff-check.outputs.prisma-changed }}
      ai-changed: ${{ steps.diff-check.outputs.ai-changed }}
      copilot-changed: ${{ steps.diff-check.outputs.copilot-changed }}
      manufacturing-changed: ${{ steps.diff-check.outputs.manufacturing-changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MAXP3_CHECKOUT_TOKEN || github.token }}
          fetch-depth: 0 # full history so the build always checks out the exact pushed source

      - name: Skip if superseded by a newer commit
        id: check-latest
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "is-latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --force origin main
          LATEST=$(git rev-parse origin/main)
          if [ "$LATEST" != "$COMMIT_SHA" ]; then
            echo "⏭️ This build ($COMMIT_SHA → $(git log -1 --format=%s)) is superseded by a newer commit on main ($LATEST)."
            echo "   Skipping to avoid redundant rebuild — the newer commit's deploy will cover these changes."
            echo "is-latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ This is the latest commit on main. Proceeding with deploy."
          echo "is-latest=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "❌ SERVER_HOST missing"; exit 1; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "❌ SERVER_USER missing"; exit 1; fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then echo "❌ SERVER_SSH_KEY missing"; exit 1; fi
          echo "✅ All secrets present"

      # 🛡️ RADICAL SAFETY GATE — full syntax check over all runtime backend files.
      # Any commit with a SyntaxError in a runtime file blocks the deploy BEFORE
      # it reaches the server (a broken commit previously crashed the backend → 502).
      - name: Full Backend Syntax Gate
        working-directory: ./apps/backend
        run: node scripts/check_syntax.js
        continue-on-error: false

      # 🛡️ RELATIVE REQUIRE SAFETY GATE — scans all relative require paths across backend files.
      # Blocks deploy BEFORE reaching the server if any required module/file is missing from the tree.
      - name: Backend Relative Requires Gate
        working-directory: ./apps/backend
        run: node scripts/check_requires.js
        continue-on-error: false

      - name: Enforce AI Agent File Size Guard
        run: |
          node scripts/check-file-sizes.js --max-kb=150

      # 🛡️ Customer Portal Routing Guard — يمنع أي merge من agents تانية يرجّع
      # بوابة العميل على الـ subdomain (اعتماد دائري بيكسر المتجر). أي مخالفة => block.
      - name: Guard Customer Portal Routing
        run: node scripts/check-customer-portal-routing.js
        continue-on-error: false

      # 🔍 Intelligent Component Change Detection
      # Uses github.event.before to inspect ALL commits in a push
      - name: Check Component Changes
        id: diff-check
        shell: bash
        env:
          FORCE_ALL: ${{ github.event.inputs.force_rebuild_all || 'false' }}
          EVENT_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$FORCE_ALL" = "true" ]; then
            echo "⚡ Force rebuild requested — marking all components changed"
            echo "fb-changed=true" >> "$GITHUB_OUTPUT"
            echo "fe-needed=true" >> "$GITHUB_OUTPUT"
            echo "cat-changed=true" >> "$GITHUB_OUTPUT"
            echo "backend-deps-changed=true" >> "$GITHUB_OUTPUT"
            echo "prisma-changed=true" >> "$GITHUB_OUTPUT"
            echo "ai-changed=true" >> "$GITHUB_OUTPUT"
            echo "copilot-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="$EVENT_BEFORE"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BEFORE="HEAD~1"
            else
              echo "⚠️ No parent commit found — marking all components changed"
              echo "fb-changed=true" >> "$GITHUB_OUTPUT"
              echo "fe-needed=true" >> "$GITHUB_OUTPUT"
              echo "cat-changed=true" >> "$GITHUB_OUTPUT"
              echo "backend-deps-changed=true" >> "$GITHUB_OUTPUT"
              echo "prisma-changed=true" >> "$GITHUB_OUTPUT"
              echo "ai-changed=true" >> "$GITHUB_OUTPUT"
              echo "copilot-changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "🔎 Diffing changed files between $BEFORE and $COMMIT_SHA..."
          CHANGED=$(git diff --name-only "$BEFORE" "$COMMIT_SHA")

          # 1. Facebook Ads Changes
          if echo "$CHANGED" | grep -qE "apps/backend/(controller/facebookAds|services/facebookAds|utils/.*facebook|tests/controller/facebookAds)"; then
            echo "fb-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fb-changed=false" >> "$GITHUB_OUTPUT"
          fi

          # 1b. Copilot reliability surface (agent chat history + attachments sanitizer)
          if echo "$CHANGED" | grep -qE "apps/backend/(controller/aiAgentChatController|services/(aiServiceAdminClient|aiSessionService|agentStudioSessionService)|tests/(controller/aiAgentChatController|services/aiServiceAdminClient))"; then
            echo "copilot-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "copilot-changed=false" >> "$GITHUB_OUTPUT"
          fi

          # 1c. Manufacturing Partner Agreements Lifecycle
          if echo "$CHANGED" | grep -qE "apps/backend/(controller/manufacturingController|services/manufacturingFactoryAgreementService|routes/manufacturingRoutes|tests/controller/manufacturingFactoryAgreements)"; then
            echo "manufacturing-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "manufacturing-changed=false" >> "$GITHUB_OUTPUT"
          fi

          # 2. Frontend Changes (apps/frontend, shared, nginx_configs, customer-portal guard)
          if echo "$CHANGED" | grep -qE "^(apps/frontend/|shared/|nginx_configs/|scripts/check-customer-portal-routing\.js)"; then
            echo "fe-needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fe-needed=false" >> "$GITHUB_OUTPUT"
          fi

          # 3. Marketplace Catalog Changes
          if echo "$CHANGED" | grep -qE "apps/backend/catalog/marketplace/|apps/backend/prisma/seeds/"; then
            echo "cat-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cat-changed=false" >> "$GITHUB_OUTPUT"
          fi

          # 4. Backend Dependencies Changed
          if echo "$CHANGED" | grep -qE "^apps/backend/package-lock\.json"; then
            echo "backend-deps-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend-deps-changed=false" >> "$GITHUB_OUTPUT"
          fi

          # 5. Prisma Schema Changed
          if echo "$CHANGED" | grep -qE "^apps/backend/prisma/"; then
            echo "prisma-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "prisma-changed=false" >> "$GITHUB_OUTPUT"
          fi

          # 6. Python AI Service Changed
          if echo "$CHANGED" | grep -qE "^apps/ai-service/"; then
            echo "ai-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ai-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Backend node_modules
        if: steps.diff-check.outputs.fb-changed == 'true'
        uses: actions/cache@v4
        id: cache-backend
        with:
          path: apps/backend/node_modules
          key: backend-node-${{ hashFiles('apps/backend/package-lock.json') }}
          restore-keys: |
            backend-node-

      - name: Cache Frontend node_modules
        if: steps.diff-check.outputs.fe-needed == 'true'
        uses: actions/cache@v4
        id: cache-frontend
        with:
          path: apps/frontend/node_modules
          key: frontend-node-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            frontend-node-

      # Only install backend deps + run the backend regressions when
      # backend test surfaces actually changed — otherwise skip (saves ~56s/deploy).
      - name: Install Backend Test Dependencies
        if: steps.diff-check.outputs.fb-changed == 'true' || steps.diff-check.outputs.copilot-changed == 'true' || steps.diff-check.outputs.manufacturing-changed == 'true'
        working-directory: ./apps/backend
        run: |
          npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: '1'
          HUSKY: '0'
        continue-on-error: false

      - name: Strip BOM from Prisma Schema files
        if: steps.diff-check.outputs.fb-changed == 'true'
        shell: bash
        working-directory: ./apps/backend
        run: |
          # Remove UTF-8 BOM from every .prisma schema file. A BOM at the start of
          # the first line breaks `prisma generate` ("does not start with any known
          # Prisma schema keyword").
          find prisma/schema -name "*.prisma" -type f -print0 | while IFS= read -r -d '' f; do
            if [ "$(head -c3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              sed -i '1s/^\xEF\xBB\xBF//' "$f"
              echo "🧹 Stripped BOM from $f"
            fi
          done

      - name: Generate Prisma Client
        if: steps.diff-check.outputs.fb-changed == 'true'
        working-directory: ./apps/backend
        run: |
          npx prisma generate --schema=prisma/schema
        continue-on-error: false

      - name: Run Facebook Ads Regression Tests
        if: steps.diff-check.outputs.fb-changed == 'true'
        working-directory: ./apps/backend
        run: |
          npm test -- --testPathPattern="tests/controller/facebookAdsController.fullAd.test.js"
        continue-on-error: false

      - name: Run Copilot Reliability Regression Tests
        if: steps.diff-check.outputs.copilot-changed == 'true'
        working-directory: ./apps/backend
        run: |
          npm test -- --testPathPattern="(tests/controller/aiAgentChatController.history.test.js|tests/services/aiServiceAdminClient.attachments.test.js)"
        continue-on-error: false

      - name: Run Manufacturing Factory Agreements Regression Tests
        if: steps.diff-check.outputs.manufacturing-changed == 'true'
        working-directory: ./apps/backend
        run: |
          npm test -- --testPathPattern="tests/controller/manufacturingFactoryAgreements.regression.test.js"
        continue-on-error: false

      # Build Frontend (skipped when only backend files changed)
      - name: Install Frontend Dependencies
        if: steps.diff-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: |
          if [ "${{ steps.cache-frontend.outputs.cache-hit }}" != 'true' ] || [ ! -f node_modules/.bin/vite ]; then
            echo "📦 Installing frontend dependencies (cache-hit=${{ steps.cache-frontend.outputs.cache-hit }}, vite-found=$(test -f node_modules/.bin/vite && echo yes || echo no))..."
            npm ci || npm install
          else
            echo "✅ Frontend dependencies restored from cache and vite binary found"
          fi
        env:
          HUSKY: '0'
        continue-on-error: false

      # 🛡️ Marketplace Catalog Schema Validation Gate
      - name: Validate Marketplace Catalog
        if: steps.diff-check.outputs.cat-changed == 'true'
        working-directory: ./apps/backend
        run: node scripts/catalog/validate_marketplace_catalog.js
        continue-on-error: false

      # 🛡️ يمنع أي "icon: X" يستخدم معرّفاً غير مستورد في src/config (كان سبب انهيار الـ dashboard)
      - name: Check Frontend Icon Imports
        if: steps.diff-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: node scripts/check-icon-imports.cjs
        continue-on-error: false

      # 🛡️ يمنع أسماء أيقونات heroicons غير موجودة في النسخة المتسطبة
      # (Loader2Icon/PackageSearchIcon كسروا build الـ vite على CI مرتين)
      - name: Check Heroicons Imports
        if: steps.diff-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: node scripts/check-heroicons.cjs
        continue-on-error: false

      # 🛡️ المعيار الذهبي 2026: فحص Rust فائق السرعة عبر oxlint + فاحص AST لمنع أي نقص استيراد أو متغير غير معرّف
      - name: 2026 High-Speed Rust & AST Safety Gate (Oxlint & Undeclared Components)
        if: steps.diff-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: |
          npx oxlint --config .oxlintrc.json src
          node scripts/check-undeclared-components.cjs
        continue-on-error: false

      - name: Build Frontend
        if: steps.diff-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: |
          # Force a clean build: drop any cached dist so stale chunks can never ship.
          rm -rf dist node_modules/.vite
          npm run build
          test -f dist/placeholders/luxury-shoes/hero.png
          echo "📂 Listing build files:"
          ls -R dist | head -n 20
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          VITE_DISABLE_COMPRESSION: 'true'
          VITE_BUILD_MINIFY: 'esbuild'
        continue-on-error: false

      - name: Validate i18n Sections
        if: steps.diff-check.outputs.fe-needed == 'true'
        run: node scripts/validate-i18n.js
        continue-on-error: false

      # 🛡️ يمنع الـ entry chunk من استيراد أي route chunk استيرادًا ساكنًا — الحادثة
      # دي زوّدت تحميل المتجر الأول ~2.5MB (كود المنصة كله نزل مع كل زائر متجر)
      - name: Check Entry Chunk Purity
        if: steps.diff-check.outputs.fe-needed == 'true'
        working-directory: ./apps/frontend
        run: node scripts/check-entry-chunks.cjs
        continue-on-error: false

      - name: Check i18n Consistency (AR vs EN)
        if: steps.diff-check.outputs.fe-needed == 'true'
        run: node scripts/i18n-check.js
        continue-on-error: false

      # Packaging for reliable transfer (Optimized parallel creation with fast compression & exclusions)
      - name: Package Assets
        env:
          FE_NEEDED: ${{ steps.diff-check.outputs.fe-needed }}
        run: |
          echo "📦 Starting parallel packaging..."

          if [ "$FE_NEEDED" == "true" ]; then
            (tar -czf frontend.tar.gz -C apps/frontend/dist . && echo "✓ Frontend packaged") &
            (tar -czf theme-presets.tar.gz -C apps/frontend/src/storefront/themes . && echo "✓ Themes packaged") &
          else
            echo "ℹ️ Skipping frontend tarballs (backend-only deploy)"
          fi

          (tar -czf backend.tar.gz -C apps \
            --exclude="backend/node_modules" \
            --exclude="backend/prisma/generated" \
            --exclude="backend/legacy_mysql" \
            --exclude="backend/uploads" \
            --exclude="backend/*.tar.gz" \
            --exclude="backend/__tests__" \
            --exclude="backend/tests" \
            --exclude="backend/testsprite_tests" \
            --exclude="backend/docs" \
            --exclude="backend/coverage" \
            --exclude="backend/*.log" \
            backend && echo "✓ Backend packaged") &

          (tar -czf shared.tar.gz -C shared . && echo "✓ Shared packaged") &

          (tar -czf ai-service.tar.gz \
            --exclude=".env" \
            --exclude=".venv" \
            --exclude="__pycache__" \
            --exclude=".pytest_cache" \
            --exclude=".ruff_cache" \
            --exclude="*.pyc" \
            -C apps ai-service && echo "✓ AI service packaged") &

          (rm -rf deploy_nginx && mkdir -p deploy_nginx && \
           cp nginx_configs/maxp.online.conf deploy_nginx/maxp.online.conf && \
           cp nginx_configs/mokhtarelhenawy.online.conf deploy_nginx/mokhtarelhenawy.online.conf && \
           tar -czf nginx-configs.tar.gz -C deploy_nginx . && \
           rm -rf deploy_nginx && echo "✓ Nginx packaged") &

          wait
          echo "✅ All packages created successfully in parallel:"
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -lh *.tar.gz

      # ───────────────────────────────────────────────────────────────────
      # نقل التاربولز للسيرفر (staging فقط — آمن، لا يلمس الحالة الحية)
      # ───────────────────────────────────────────────────────────────────
      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Test SSH Connection
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          # Hostinger cloud firewall / fail2ban intermittently drops runner IPs.
          # Retry so a single dropped SYN doesn't waste the whole finished build.
          for i in 1 2 3 4 5; do
            if ssh -4 -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$SERVER_USER@$SERVER_HOST" \
              "echo '✅ SSH connection successful' && df -h \$HOME"; then
              exit 0
            fi
            echo "⚠️ SSH attempt $i/5 failed — retrying in 12s..."
            sleep 12
          done
          echo "❌ SSH unreachable after 5 attempts. Likely fail2ban/cloud-firewall ban of this runner IP."
          echo "   See apps/backend/docs/infrastructure/github-actions-ssh-firewall-2026-05-25.md"
          exit 1

      - name: Get Runner IP
        run: |
          RUNNER_IP=$(curl -s https://ifconfig.me)
          echo "🌐 GitHub Runner Public IP: $RUNNER_IP"
          echo "🎯 Target SSH Port: ${{ env.SERVER_SSH_PORT }}"

      # Setup Remote Staging Directory — التنظيف age-based عشان محدش يمسح
      # staging تبع deploy شغال في الخلفية (كانت rm -rf لكل حاجة).
      - name: Setup Remote Staging Directory
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SSH_KEY_PATH="$HOME/.ssh/maxp_deploy_key"
          ssh -4 -i "$SSH_KEY_PATH" -p "$SERVER_SSH_PORT" -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" "
            set -e
            echo '🧹 Cleaning stale staging dirs (older than 1 day)...'
            find \$HOME -maxdepth 1 -name 'deploy_staging_*' -mtime +1 -exec rm -rf {} + 2>/dev/null || true
            sudo rm -rf /tmp/deploy_staging_* /tmp/*.tar.gz /tmp/*.bak 2>/dev/null || true
            sudo journalctl --vacuum-time=1d 2>/dev/null || true
            pm2 flush 2>/dev/null || true

            DEPLOY_STAGING=\"\$HOME/deploy_staging_${GITHUB_RUN_ID}\"
            echo \"🚀 Creating staging directory: \$DEPLOY_STAGING\"
            rm -rf \"\$DEPLOY_STAGING\"
            mkdir -p \"\$DEPLOY_STAGING/backend\"
            mkdir -p \"\$DEPLOY_STAGING/frontend\"
            echo '✅ Staging directory created.'
            echo '📊 Free disk space on server:'
            df -h \$HOME
          "

      # Deploy Tarballs to Server
      - name: Deploy Tarballs to Server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SSH_KEY_PATH="$HOME/.ssh/maxp_deploy_key"
          ssh-keyscan -4 -p "$SERVER_SSH_PORT" -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          for i in 1 2 3; do
            echo "🔄 SCP attempt $i/3..."
            if timeout 30m scp -4 \
              -i "$SSH_KEY_PATH" \
              -P "$SERVER_SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o ConnectTimeout=30 \
              *.tar.gz SHA256SUMS \
              "$SERVER_USER@$SERVER_HOST:deploy_staging_${GITHUB_RUN_ID}/"; then
              echo "✅ Tarballs and checksums transferred successfully"
              break
            else
              echo "⚠️ SCP attempt $i failed"
              if [ $i -eq 3 ]; then
                echo "❌ All SCP attempts failed"
                exit 1
              fi
              sleep 5
            fi
          done

          echo "📋 Copying deployment script..."
          scp -4 -i "$SSH_KEY_PATH" -P "$SERVER_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            scripts/deploy-remote.sh \
            "$SERVER_USER@$SERVER_HOST:deploy_staging_${GITHUB_RUN_ID}/deploy-remote.sh"

  # ═══════════════════════════════════════════════════════════════════
  # DEPLOY job — ينفذ deploy-remote.sh على السيرفر فقط (never cancel)
  # cancel-in-progress: false — الديبلوي اللي شغال لازم يخلص من غير ما
  # يتقطع في النص (npm prune / prisma migrate / pm2 restart).
  # الـ pending الأقدم بيتلغي أوتوماتيك لصالح الأحدث (سلوك GitHub الافتراضي).
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Server (never cancel)
    runs-on: ubuntu-latest
    needs: build
    # مش هينضاف للطابور غير لما الـ build يكون هو الأحدث على main.
    if: needs.build.outputs.is-latest == 'true'
    environment: production
    concurrency:
      group: production-deploy-apply
      cancel-in-progress: false
    timeout-minutes: 45

    steps:
      - name: Skip deploy if superseded while waiting in queue
        id: check-deploy-latest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${REPO}/commits/main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          if [ -n "$LATEST" ] && [ "$LATEST" != "$COMMIT_SHA" ]; then
            echo "⏭️ Skipping deploy: commit $COMMIT_SHA is superseded by $LATEST on main."
            echo "   The newer commit's deploy will cover these changes."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ Still the latest commit on main. Proceeding with deploy."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      # Hostinger cloud firewall / fail2ban intermittently drops runner IPs —
      # historically the #1 cause of deploy failures (dial tcp timeout).
      # Probe with retries BEFORE appleboy so a transient drop doesn't kill the deploy.
      - name: Wait for SSH connectivity (retry)
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ env.SERVER_SSH_PORT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if ssh -4 -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_SSH_PORT" \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$SERVER_USER@$SERVER_HOST" "echo ok" >/dev/null 2>&1; then
              echo "✅ SSH reachable (attempt $i)"
              exit 0
            fi
            echo "⚠️ Attempt $i/6 failed, backing off 12s..."
            sleep 12
          done
          echo "❌ SSH unreachable from this runner after 6 attempts over ~3 minutes."
          echo "   This matches the known fail2ban/Hostinger-firewall IP-ban pattern."
          exit 1

      - name: Run Deployment Script on Server
        if: steps.check-deploy-latest.outputs.proceed == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          CATALOG_CHANGED: ${{ needs.build.outputs.catalog-changed }}
          BACKEND_DEPS_CHANGED: ${{ needs.build.outputs.backend-deps-changed }}
          PRISMA_CHANGED: ${{ needs.build.outputs.prisma-changed }}
          AI_CHANGED: ${{ needs.build.outputs.ai-changed }}
          FE_NEEDED: ${{ needs.build.outputs.fe-needed }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: false
          timeout: 40m
          command_timeout: 35m
          envs: GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,SUPER_ADMIN_EMAIL,SUPER_ADMIN_PASSWORD,CATALOG_CHANGED,BACKEND_DEPS_CHANGED,PRISMA_CHANGED,AI_CHANGED,FE_NEEDED
          script: |
            set -e
            sudo -n true || {
              echo "❌ Passwordless sudo is required for production deploys"
              exit 1
            }
            export DEPLOY_STAGING="$HOME/deploy_staging_${GITHUB_RUN_ID}"
            exec 9>/tmp/maxp-production-deploy.lock
            if ! flock -w 180 9; then
              echo "❌ Another production deployment is still running on the server after 180s"
              exit 1
            fi
            bash "$DEPLOY_STAGING/deploy-remote.sh"
