<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file: data: blob:; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: blob: http: https: file:; font-src 'self' data: file:; connect-src 'self' https: wss: ws://localhost:* http://localhost:* file:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230284c7'/></svg>" />
  <title>MaxP Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090b;
      color: #fafafa;
      overflow: hidden;
      -webkit-app-region: no-drag;
      user-select: text;
      -webkit-user-select: text;
    }
    ::selection {
      background: rgba(56, 189, 248, 0.35);
      color: #ffffff;
    }
    input, textarea, [contenteditable="true"] {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInLeft {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    @keyframes maxpShimmer { 0% { opacity: 0.45; } 50% { opacity: 0.9; } 100% { opacity: 0.45; } }
    .maxp-skeleton { animation: maxpShimmer 1.3s ease-in-out infinite; }
    /* Tasks table: progressive degradation on narrow windows (window = viewport) */
    @media (max-width: 1180px) { .task-col-est { display: none !important; } }
    @media (max-width: 1080px) { .task-col-person { display: none !important; } }
    @media (max-width: 980px) {
      .task-col-actions { width: auto !important; }
      .task-action-label { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
