name: Remote Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run WhatsApp Test on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            cd /var/www/backend2
            
            echo "=== Step 1: Find session for company ==="
            SESSION_ID=$(node -e "
              const { getSharedPrismaClient } = require('./services/sharedDatabase');
              const prisma = getSharedPrismaClient();
              async function run() {
                const rows = await prisma.\$queryRawUnsafe('SELECT id FROM \"WhatsAppSession\" WHERE \"companyId\" = \$1 ORDER BY \"createdAt\" DESC LIMIT 1', 'cmlcbycma0000ju8l8tcbrbby');
                console.log(rows.length > 0 ? rows[0].id : 'NONE');
              }
              run().catch(e => { console.error(e.message); process.exit(1); }).finally(() => prisma.\$disconnect());
            ")
            echo "Found session: $SESSION_ID"
            
            if [ "$SESSION_ID" = "NONE" ] || [ -z "$SESSION_ID" ]; then
              echo "=== Creating new session ==="
              node -e "
                const { getSharedPrismaClient } = require('./services/sharedDatabase');
                const prisma = getSharedPrismaClient();
                async function run() {
                  await prisma.\$executeRawUnsafe(\"INSERT INTO \\\"WhatsAppSession\\\" (id, name, status, \\\"phoneNumber\\\", \\\"companyId\\\", provider, \\\"sessionProvider\\\", \\\"createdAt\\\", \\\"updatedAt\\\") VALUES (gen_random_uuid()::text, 'Meta Cloud Test', 'CONNECTED', '201123087745', 'cmlcbycma0000ju8l8tcbrbby', 'cloud_api', 'META_CLOUD', NOW(), NOW())\");
                  console.log('Session created');
                }
                run().catch(e => { console.error(e.message); process.exit(1); }).finally(() => prisma.\$disconnect());
              "
            else
              echo "=== Updating session to CONNECTED ==="
              node -e "
                const { getSharedPrismaClient } = require('./services/sharedDatabase');
                const prisma = getSharedPrismaClient();
                async function run() {
                  await prisma.\$executeRawUnsafe(\"UPDATE \\\"WhatsAppSession\\\" SET status = 'CONNECTED', \\\"sessionProvider\\\" = 'META_CLOUD' WHERE id = '\$SESSION_ID'\");
                  console.log('Session updated');
                }
                run().catch(e => { console.error(e.message); process.exit(1); }).finally(() => prisma.\$disconnect());
              "
            fi
            
            echo "=== Step 2: Run test ==="
            node scripts/test-direct.js
