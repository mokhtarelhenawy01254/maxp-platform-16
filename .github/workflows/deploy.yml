name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, Test & Trigger Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.MAXP3_CHECKOUT_TOKEN || github.token }}
          fetch-depth: 2

      - name: Documentation Compliance Check
        run: |
          node scripts/verify-docs.js

      - name: Arabic Strings Compliance Check (AGENTS.md)
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(js|ts|tsx|jsx)$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Scanning changed files: $CHANGED_FILES"
            node scripts/check-arabic-strings.js --staged $CHANGED_FILES
          else
            echo "No changed JS/TS/JSX/TSX files to scan."
          fi

      - name: Enforce AI Agent File Size Guard
        run: |
          node scripts/check-file-sizes.js --max-kb=150

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/backend/package-lock.json

      - name: Install Backend Test Dependencies
        working-directory: ./apps/backend
        run: |
          npm ci || npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: '1'
        continue-on-error: false

      - name: Run Facebook Ads Regression Tests
        working-directory: ./apps/backend
        run: |
          npx jest tests/controller/facebookAdsController.fullAd.test.js --runInBand --testTimeout=30000 --forceExit
        continue-on-error: false

      - name: Run AI Agent Test Suite
        working-directory: ./apps/backend
        run: |
          npx jest --testPathPattern="tests/services/agent|tests/services/aiChat" --runInBand --testTimeout=30000 --forceExit
        continue-on-error: true

      - name: Send Deploy Webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "❌ DEPLOY_WEBHOOK_URL is missing"
            exit 1
          fi
          if [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "❌ DEPLOY_WEBHOOK_SECRET is missing"
            exit 1
          fi
          
          # Payload format
          PAYLOAD='{"ref":"refs/heads/main","run_id":"${{ github.run_id }}","sha":"${{ github.sha }}"}'
          
          # Signature
          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | awk '{print $2}')"
          
          # Trigger deploy
          echo "🚀 Sending deploy webhook..."
          HTTP_CODE=$(curl -s -o /tmp/webhook_response.json -w "%{http_code}" \
            -X POST "$DEPLOY_WEBHOOK_URL/deploy" \
            -H "Content-Type: application/json" \
            -H "x-deploy-signature: $SIGNATURE" \
            --max-time 30 \
            -d "$PAYLOAD")
            
          echo "Response code: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/webhook_response.json || true
          echo ""
          
          if [ "$HTTP_CODE" -ne 202 ] && [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Webhook deploy trigger failed with status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Webhook accepted, deployment triggered"

      - name: Wait and Health Check
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "⏳ Waiting 90s for deployment to complete on server..."
          sleep 90
          
          BASE_URL=$(echo "$DEPLOY_WEBHOOK_URL" | sed 's|/deploy$||')
          echo "🔎 Checking health at $BASE_URL/api/v1/health"
          
          # Retry health check up to 3 times
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."
            if curl -fsS --max-time 15 "$BASE_URL/api/v1/health"; then
              echo "✅ Health check passed!"
              exit 0
            fi
            
            # Fallback check to root health or /health just in case
            if curl -fsS --max-time 15 "$BASE_URL/health"; then
              echo "✅ Health check passed on fallback /health!"
              exit 0
            fi

            if [ $attempt -lt 3 ]; then
              echo "⏳ Health check failed, waiting 15s before retry..."
              sleep 15
            fi
          done
          
          echo "❌ Health check failed after retries"
          exit 1
