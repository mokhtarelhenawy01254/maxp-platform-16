name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع الحزمة (Build Type)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Frontend Dependencies
        working-directory: apps/frontend
        run: npm ci --legacy-peer-deps

      - name: Build Web Bundle
        working-directory: apps/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_DISABLE_COMPRESSION: "true"
        run: npm run build

      - name: Sync Web Assets to Android Project
        working-directory: apps/frontend
        run: npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: apps/frontend/android
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate Generated APK
        id: apk-finder
        run: |
          APK_PATH=$(find apps/frontend/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxP-Mobile-Android-${{ github.event.inputs.build_type || 'debug' }}-${{ github.run_number }}
          path: ${{ steps.apk-finder.outputs.apk_path }}
          retention-days: 30
