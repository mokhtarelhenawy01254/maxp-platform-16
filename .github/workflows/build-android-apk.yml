name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع الحزمة (Build Type)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      deploy_to_server:
        description: 'نشر تلقائي للسيرفر لرابط التحميل المباشر (Deploy to maxp.online/download/maxp.apk)'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Android Version Sync (build.gradle == latest-android.json == appUpdateService.ts)
        run: bash scripts/verify-android-version-sync.sh

      - name: Install Frontend Dependencies
        working-directory: apps/frontend
        run: npm ci --legacy-peer-deps

      - name: Build Web Bundle
        working-directory: apps/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_DISABLE_COMPRESSION: "true"
          VITE_API_URL: "https://maxp.online/api/v1"
          VITE_BACKEND_URL: "https://maxp.online"
          VITE_WS_URL: "wss://maxp.online"
        run: npm run build

      - name: Sync Web Assets to Android Project
        working-directory: apps/frontend
        run: npx cap sync android

      - name: Prepare Signing Keystore
        working-directory: apps/frontend/android/app
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > maxp-release.keystore
            echo "✅ Release keystore loaded from GitHub Secrets."
          elif [ -f "maxp-release.keystore" ]; then
            echo "ℹ️ Using existing repository maxp-release.keystore."
          fi

      - name: Build Android APK with Gradle
        working-directory: apps/frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'maxp2026' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'maxp' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'maxp2026' }}
        run: |
          chmod +x gradlew
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate Generated APK & Calculate Metadata
        id: apk-finder
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            APK_PATH=$(find apps/frontend/android/app/build/outputs/apk/ -name "*release*.apk" | grep -v "unaligned" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find apps/frontend/android/app/build/outputs/apk/ -name "*.apk" | grep -v "unaligned" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

          FILE_SIZE_BYTES=$(stat -c%s "$APK_PATH")
          FILE_SIZE_MB=$(( (FILE_SIZE_BYTES + 1048576/2) / 1048576 ))
          RELEASE_DATE=$(date -u +"%Y-%m-%d")

          echo "size_bytes=$FILE_SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "size_formatted=${FILE_SIZE_MB} MB" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT

          echo "📊 APK Metrics: $FILE_SIZE_BYTES bytes (~${FILE_SIZE_MB} MB) built on $RELEASE_DATE"

          VERSION_CODE=$(grep -E "versionCode\s+[0-9]+" apps/frontend/android/app/build.gradle | head -n 1 | awk '{print $2}')
          VERSION_NAME=$(grep -E 'versionName\s+"[^"]+"' apps/frontend/android/app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=${VERSION_CODE:-9}
          VERSION_NAME=${VERSION_NAME:-"1.0.9"}

          echo "📦 Parsed Android Version: $VERSION_NAME (build $VERSION_CODE)"

          cat <<EOF > latest-android.json
          {
            "platform": "android",
            "appName": "MaxP",
            "appId": "online.maxp.app",
            "latestVersion": "$VERSION_NAME",
            "latestVersionCode": $VERSION_CODE,
            "minRequiredVersion": "1.0.8",
            "minRequiredVersionCode": 8,
            "forceUpdate": false,
            "downloadUrl": "https://maxp.online/download/maxp.apk",
            "directApkUrl": "https://maxp.online/download/maxp.apk",
            "storeUrl": "https://maxp.online/download/maxp.apk",
            "releaseNotesAr": "إصدار رسمي جديد يتضمن ميزة الاتصال الصادر بنقرة واحدة وربط المكالمات بالطلبات تلقائياً، مع تحسينات شاملة في سرعة الاستجابة والمزامنة.",
            "releaseNotesEn": "Official update introducing Outbound Click-to-Call telephony integration, official call duration sync, and real-time connectivity fixes.",
            "releaseDate": "$RELEASE_DATE",
            "fileSizeBytes": $FILE_SIZE_BYTES,
            "fileSizeFormatted": "${FILE_SIZE_MB} MB",
            "featuresAr": [
              "الاتصال الصادر السحابي بنقرة واحدة عبر هاتف الموظف",
              "توثيق مدة المكالمة الرسمية تلقائياً وربطها بسجل الطلب",
              "نافذة التوثيق السريع وتحديث حالات الطلبات بعد كل مكالمة",
              "مزامنة فورية لحالة اتصال الهاتف بدون استهلاك للبطارية"
            ]
          }
          EOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxP-Mobile-Android-${{ github.event.inputs.build_type || 'release' }}-${{ github.run_number }}
          path: ${{ steps.apk-finder.outputs.apk_path }}
          retention-days: 30

      - name: Setup SSH Key for Server Deployment
        if: ${{ github.event.inputs.deploy_to_server != 'false' }}
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy APK to Production Server
        if: ${{ github.event.inputs.deploy_to_server != 'false' }}
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          APK_FILE: ${{ steps.apk-finder.outputs.apk_path }}
          SIZE_BYTES: ${{ steps.apk-finder.outputs.size_bytes }}
          SIZE_FORMATTED: ${{ steps.apk-finder.outputs.size_formatted }}
          RELEASE_DATE: ${{ steps.apk-finder.outputs.release_date }}
        run: |
          echo "🚀 Deploying APK and latest-android.json to production server..."
          ssh -4 -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p /var/www/frontend2/dist/download /var/www/frontend2/dist/downloads"

          scp -4 -i "$HOME/.ssh/maxp_deploy_key" -P "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$APK_FILE" "$SERVER_USER@$SERVER_HOST:/var/www/frontend2/dist/download/maxp.apk"

          scp -4 -i "$HOME/.ssh/maxp_deploy_key" -P "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new \
            latest-android.json "$SERVER_USER@$SERVER_HOST:/var/www/frontend2/dist/download/latest-android.json"

          ssh -4 -i "$HOME/.ssh/maxp_deploy_key" -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$SERVER_USER@$SERVER_HOST" \
            "cp -f /var/www/frontend2/dist/download/maxp.apk /var/www/frontend2/dist/downloads/maxp.apk && \
             cp -f /var/www/frontend2/dist/download/latest-android.json /var/www/frontend2/dist/downloads/latest-android.json && \
             chmod 644 /var/www/frontend2/dist/download/maxp.apk /var/www/frontend2/dist/downloads/maxp.apk /var/www/frontend2/dist/download/latest-android.json /var/www/frontend2/dist/downloads/latest-android.json"

          echo "✅ APK successfully published to https://maxp.online/download/maxp.apk"
