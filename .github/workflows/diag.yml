name: Remote Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

jobs:
  diagnose:
    name: Run Remote Diagnostics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ env.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run WhatsApp Order Test on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          debug: true
          script: |
            cd /var/www/backend2
            echo "=== Backend logs around ORDER_CREATED send (08:52) ==="
            tail -n 400 logs/out.log 2>/dev/null | grep -E "META-CLOUD|FALLBACK|ORDER_CREATED|swan_pending|sendTemplate|Template message result|sendTemplateMessage|08:52" | tail -n 40
            echo "=== err.log ==="
            tail -n 200 logs/err.log 2>/dev/null | grep -E "META|template|Template|swan_pending|fallback|Fallback" | tail -n 20
            echo "=== Checking notification log for real order ORD-741511-339 ==="
            node -e "
              const { getSharedPrismaClient } = require('./services/sharedDatabase');
              const prisma = getSharedPrismaClient();
              async function run() {
                const order = await prisma.order.findFirst({ where: { orderNumber: 'ORD-741511-339' } });
                console.log('ORDER:', JSON.stringify({ id: order?.id, orderNumber: order?.orderNumber, customerPhone: order?.customerPhone, status: order?.status }));
                if (order) {
                  const logs = await prisma.\$queryRawUnsafe('SELECT status, \"eventType\", \"recipientPhone\", \"templateId\", \"sessionId\", \"failureReason\", \"content\", \"createdAt\" FROM whatsapp_notification_logs WHERE \"orderId\" = \$1 ORDER BY \"createdAt\" DESC', order.id);
                  console.log('LOGS:', JSON.stringify(logs));
                  if (logs.length > 0) {
                    const tpl = logs[0].templateId ? await prisma.\$queryRawUnsafe('SELECT id, name, \"metaTemplateName\", \"metaTemplateStatus\", channel, \"eventType\" FROM whatsapp_notification_templates WHERE id = \$1', logs[0].templateId) : [];
                    console.log('TEMPLATE:', JSON.stringify(tpl));
                    const sess = await prisma.\$queryRawUnsafe('SELECT id, name, provider, status FROM whatsapp_sessions WHERE id = \$1', logs[0].sessionId);
                    console.log('SESSION:', JSON.stringify(sess));
                }
                const msgs = await prisma.\$queryRawUnsafe('SELECT id, \"messageId\", type, content, \"interactiveData\", status, \"createdAt\" FROM whatsapp_messages WHERE \"recipientPhone\" = \$1 OR content LIKE \$2 ORDER BY \"createdAt\" DESC LIMIT 5', '201123087745', '%مختار%');
                console.log('WHATSAPP_MESSAGES:', JSON.stringify(msgs));
                }
              }
              run().catch(e => { console.error('ERROR:', e.message); process.exit(1); }).finally(() => prisma.\$disconnect());
            "
